<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="icon" href="../favicon.ico" sizes="any"/>
  <link rel="apple-touch-icon" href="../apple-touch-icon.png"/>
  <link rel="manifest" href="../manifest.json"/>
  <meta name="theme-color" content="#061b2a"/>
  <meta name="apple-mobile-web-app-title" content="CONTECS"/>
  <title>POSPER — CONTECS 2026</title>
  <style>
    /* Paleta de POSPER (patrocinador), como en el dashboard y los randomizer. */
    :root {
      --pp-noche: #061b2a;
      --pp-azul: #0b3857;
      --pp-rojo: #980000;
      --pp-laser: #cc0000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #fff;
      background:
        radial-gradient(circle at 85% 40%, rgba(204,0,0,0.68), transparent 34%),
        linear-gradient(125deg, #061b2a 0%, #0b3857 55%, #980000 100%);
    }
    .caja { width: 100%; max-width: 400px; text-align: center; }
    /* Láser del logo en CSS: por delante del código de barras (.laser) y por
       detrás de las letras (::after), igual que en el dashboard de POSPER. */
    .marca { position: relative; width: min(280px, 80vw); margin: 0 auto 28px; }
    .marca::after, .laser {
      content: "";
      position: absolute;
      left: 2%; right: 2.2%; top: 50.6%; height: 7.4%;
      background: var(--pp-laser);
      box-shadow: 0 0 8px rgba(255,42,42,0.6);
    }
    .laser { right: 84.5%; z-index: 2; }
    .logo { position: relative; z-index: 1; display: block; width: 100%; height: auto; filter: drop-shadow(0 0 6px rgba(255,42,42,0.35)); }
    h1 { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.55; opacity: 0.9; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      margin: 26px auto 0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      display: none;
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
      background: rgba(255,255,255,0.12);
      border-left: 4px solid #ff2a2a;
    }
    .error.show { display: block; }
    .is-hidden { display: none; }
    /* Campo que recibe lo que "teclea" el lector físico al leer el QR de acceso
       (el gatillo no abre links: solo escribe en el campo con foco). */
    #captura {
      width: 100%;
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      text-align: center;
    }
    #captura::placeholder { color: rgba(255,255,255,0.75); }
    #captura:focus { outline: none; border-color: #fff; background: rgba(255,255,255,0.2); }
    /* Por si el lector escribe el link pero no avisa que terminó (sin Enter). */
    #btn-entrar {
      width: 100%;
      margin-top: 10px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--pp-laser);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
    }    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"/>
</head>
<body>
  <main class="caja">
    <div class="marca"><img class="logo" src="../img/posper/posper-logo-blanco.png" alt="POSPER" width="448" height="81"/><span class="laser" aria-hidden="true"></span></div>
    <h1 id="titulo">Entrando…</h1>
    <p id="mensaje">Abriendo la pestaña de POSPER en CONTECS 2026.</p>
    <div class="spinner" id="spinner"></div>
    <input id="captura" class="is-hidden" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Toca aquí y presiona el gatillo" aria-label="Entrada del lector"/>
    <button id="btn-entrar" class="is-hidden" type="button">Entrar</button>
    <div class="error" id="msg-error" role="alert"></div>
  </main>

  <script type="module">
    // Link de POSPER sin iniciar sesión: la clave viene en #k= (el fragmento no
    // viaja al servidor) y entrarConLinkPosper la cambia por una sesión con rol
    // posper. Ver functions/acceso-posper.js.
    import { app, auth } from "../js/core/firebase-config.js";
    import { cargarUsuario } from "../js/core/auth.js";
    import { signInWithCustomToken } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-functions.js";

    const el = id => document.getElementById(id);
    const captura = el("captura");
    // Sin Enter del lector, la lectura se da por terminada tras este silencio
    // (igual que en js/modulos/posper.js).
    const SILENCIO_FIN_MS = 600;

    // La clave sale del link (#k=...) o del texto completo que tecleó el lector.
    function claveDe(texto) {
      const limpio = String(texto || "").replace(/\s+/g, "");
      const exacta = (limpio.match(/[#?&]k=([A-Za-z0-9_-]{43})/i) || limpio.match(/^([A-Za-z0-9_-]{43})$/) || [])[1];
      return exacta || claveConSimbolosCambiados(limpio);
    }

    // Un lector que "teclea" con otra distribución de teclado (el HT330) cambia
    // los símbolos del link (: / - # = _) pero no letras ni números. La clave son
    // los últimos 43 caracteres; dentro de ella solo puede haber "-" y "_": el
    // "-" se aprende de cómo llegó "contecs-app" y cualquier otro símbolo es "_".
    function claveConSimbolosCambiados(limpio) {
      if (limpio.length < 43 || !/contecs.app.+acceso.posper/i.test(limpio)) return "";
      const guion = (limpio.match(/contecs(.)app/i) || [])[1] || "-";
      return [...limpio.slice(-43)]
        .map(ch => /[A-Za-z0-9]/.test(ch) ? ch : ch === guion ? "-" : "_")
        .join("");
    }

    function textoDeError(e) {
      // Solo un fallo de red es "revisa tu conexión"; si el servidor respondió,
      // se muestra lo que dijo.
      const sinRed = !e?.code || e.code === "functions/unavailable" || e.code === "functions/deadline-exceeded"
        || e.code === "auth/network-request-failed";
      return sinRed ? "No se pudo abrir el acceso. Revisa tu conexión e intenta de nuevo." : e.message;
    }

    async function entrar(clave) {
      const entrarConLink = httpsCallable(getFunctions(app, "us-central1"), "entrarConLinkPosper");
      const { data } = await entrarConLink({ clave });
      await signInWithCustomToken(auth, data.firebaseToken);
      await cargarUsuario(auth.currentUser);
      window.location.replace("../panel/dashboard.html");
    }

    // ─── Entrada con el lector físico ─────────────────────────────────────────
    // El gatillo de los equipos de POSPER no abre links: escribe lo leído en el
    // campo con foco. Abierta sin #k=, esta página espera esa lectura.
    let leyendo = false;
    let timer = null;
    let ultimoValor = "";

    function esperarLector(aviso = "") {
      leyendo = false;
      el("titulo").textContent = "Escanea el QR de acceso";
      el("mensaje").textContent = "Presiona el gatillo del lector apuntando al QR de POSPER.";
      el("spinner").classList.add("is-hidden");
      el("msg-error").textContent = aviso;
      el("msg-error").classList.toggle("show", !!aviso);
      captura.classList.remove("is-hidden");
      el("btn-entrar").classList.remove("is-hidden");
      captura.value = "";
      captura.focus({ preventScroll: true });
    }

    function terminarLectura(manual = false) {
      clearTimeout(timer);
      const texto = captura.value;
      captura.value = "";
      ultimoValor = "";
      if (leyendo) return;
      if (!texto.trim()) {
        // Con el link a la vista pero el campo vacío para la página, el lector
        // no está escribiendo como teclado (se configura en el equipo).
        if (manual) esperarLector("La página no recibió el texto del lector. En los ajustes del escáner pon la salida en modo teclado (Scan to Key) y vuelve a intentarlo.");
        return;
      }
      const clave = claveDe(texto);
      if (!clave) {
        // Se muestra el inicio de lo leído (sin la clave) para ver qué cambió el lector.
        const muestra = texto.trim().length > 60 ? `${texto.trim().slice(0, 60)}…` : texto.trim();
        esperarLector(`Eso no es el QR de acceso de POSPER. Escanea el QR de la pestaña QR POSPER. Se leyó: "${muestra}"`);
        return;
      }
      leyendo = true;
      captura.classList.add("is-hidden");
      el("btn-entrar").classList.add("is-hidden");
      el("msg-error").classList.remove("show");
      el("titulo").textContent = "Entrando…";
      el("mensaje").textContent = "Abriendo la pestaña de POSPER en CONTECS 2026.";
      el("spinner").classList.remove("is-hidden");
      entrar(clave).catch((e) => {
        console.error("[POSPER]", e);
        esperarLector(textoDeError(e));
      });
    }

    // Algunos lectores mandan el Enter con key "Unidentified" pero keyCode 13.
    captura.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === "Tab" || e.keyCode === 13) {
        e.preventDefault();
        terminarLectura();
      }
    });
    const programarFin = () => {
      clearTimeout(timer);
      timer = setTimeout(terminarLectura, SILENCIO_FIN_MS);
    };
    captura.addEventListener("input", programarFin);
    captura.addEventListener("compositionend", programarFin);
    captura.addEventListener("change", programarFin);
    el("btn-entrar").addEventListener("click", () => terminarLectura(true));
    // Algunos servicios de escaneo escriben en el campo sin disparar eventos.
    setInterval(() => {
      if (captura.value.trim() && captura.value === ultimoValor) terminarLectura();
      ultimoValor = captura.value;
    }, SILENCIO_FIN_MS);
    // Tocar la pantalla devuelve el foco al campo.
    document.addEventListener("pointerup", (e) => {
      if (e.target.closest("button")) return;
      if (!captura.classList.contains("is-hidden")) captura.focus({ preventScroll: true });
    });

    const claveLink = claveDe(window.location.hash);
    if (claveLink) {
      // La clave no se deja en la barra de direcciones: si falla, la página
      // queda lista para escanear de nuevo con el gatillo.
      history.replaceState(null, "", window.location.pathname);
      entrar(claveLink).catch((e) => {
        console.error("[POSPER]", e);
        esperarLector(textoDeError(e));
      });
    } else {
      esperarLector();
    }
  </script>
</body>
</html>
