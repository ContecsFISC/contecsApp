<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <link rel="icon" href="../../../favicon.ico" sizes="any"/>
 <link rel="apple-touch-icon" href="../../../apple-touch-icon.png"/>
 <title>CONTECS — Inventario</title>
 <link rel="preconnect" href="https://fonts.googleapis.com"/>
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"/>
 <link rel="stylesheet" href="../../../css/styles.css?v=20260906.1"/>
 <style>
 /* ── RESUMEN DE ALERTAS ── */
 .alertas-bar {
 display: grid;
 grid-template-columns: 1fr 1fr 1fr;
 gap: 10px;
 margin-bottom: 20px;
 }
 .alerta-stat {
 background: #fff;
 border-radius: 12px;
 padding: 14px 12px;
 text-align: center;
 box-shadow: var(--sombra-sm);
 opacity: 0;
 animation: cardCascade 0.42s var(--ease-spring) both;
 }
 .alerta-stat:nth-child(1) { animation-delay: 0.08s; }
 .alerta-stat:nth-child(2) { animation-delay: 0.15s; }
 .alerta-stat:nth-child(3) { animation-delay: 0.22s; }

 .alerta-stat .num { font-size: 26px; font-weight: 800; line-height: 1; }
 .alerta-stat .lbl { font-size: 11px; color: var(--gris-medio); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
 .num-ok { color: var(--verde-claro); }
 .num-alerta { color: var(--amarillo); }
 .num-agotado { color: var(--rojo); }

 /* ── BUSCADOR ── */
 .buscador-wrap {
 position: relative;
 margin-bottom: 16px;
 animation: pageSlideUp 0.4s var(--ease-out) both;
 animation-delay: 0.28s;
 }
 .buscador-wrap input {
 width: 100%;
 padding: 12px 14px 12px 36px;
 border: 1.5px solid var(--gris-borde);
 border-radius: var(--radio-sm);
 font-size: 15px;
 font-family: var(--fuente);
 background: #fff;
 color: var(--gris-texto);
 transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
 }
 .buscador-wrap input:focus {
 outline: none;
 border-color: var(--verde);
 box-shadow: 0 0 0 4px rgba(0,114,46,0.12);
 transform: translateY(-1px);
 }
 .buscador-wrap .icono-buscar {
 position: absolute; left: 12px; top: 50%;
 transform: translateY(-50%);
 font-size: 16px; pointer-events: none;
 }

 /* ── SECCIÓN DE CATEGORÍA ── */
 .seccion-cat { margin-bottom: 20px; }
 .seccion-cat-titulo {
 display: flex;
 align-items: center;
 gap: 8px;
 font-size: 14px;
 font-weight: 700;
 color: var(--verde-oscuro);
 margin-bottom: 10px;
 padding-bottom: 6px;
 border-bottom: 2px solid var(--verde-fondo);
 animation: slideInLeft 0.35s var(--ease-out) both;
 }

 /* ── CARDS DE INVENTARIO ── */
 .inv-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 10px;
 }
 .inv-card {
 background: #fff;
 border-radius: 12px;
 box-shadow: var(--sombra-sm);
 padding: 14px 12px;
 display: flex;
 flex-direction: column;
 align-items: center;
 gap: 6px;
 text-align: center;
 border-top: 3px solid var(--verde-claro);
 /* Cascada asignada por JS */
 opacity: 0;
 animation: cardCascade 0.38s var(--ease-spring) both;
 transition: transform 0.2s var(--ease-spring), box-shadow 0.2s;
 }
 .inv-card:hover { transform: translateY(-3px); box-shadow: var(--sombra-md); }
 .inv-card:active { transform: scale(0.95) !important; transition-duration: 0.08s; }

 .inv-card.alerta { border-top-color: var(--amarillo); }
 .inv-card.agotado { border-top-color: var(--rojo); background: var(--rojo-fondo); }

 .inv-emoji { font-size: 30px; line-height: 1; }
 .inv-emoji .icono-svg { width: 30px; height: 30px; }
 .inv-nombre { font-size: 12px; font-weight: 600; color: var(--gris-texto); line-height: 1.3; }
 .inv-stock { font-size: 22px; font-weight: 800; }
 .inv-stock.ok { color: var(--verde); }
 .inv-stock.alerta { color: var(--amarillo); }
 .inv-stock.agotado { color: var(--rojo); }

 .inv-alerta-lbl { font-size: 10px; color: var(--gris-medio); }
 .inv-badge-agotado {
 font-size: 10px;
 font-weight: 700;
 color: var(--rojo);
 background: #fff;
 padding: 2px 8px;
 border-radius: 10px;
 border: 1px solid var(--rojo);
 }

 /* ── BANNER AGOTADOS ── */
 .agotados-banner {
 background: var(--rojo-fondo);
 border: 1.5px solid var(--rojo);
 border-radius: 12px;
 padding: 14px 16px;
 margin-bottom: 20px;
 animation: fadeScaleIn 0.4s var(--ease-spring) both;
 animation-delay: 0.32s;
 }
 .agotados-banner-titulo {
 font-size: 13px;
 font-weight: 700;
 color: var(--rojo);
 margin-bottom: 10px;
 display: flex;
 align-items: center;
 gap: 6px;
 }
 .agotado-item {
 display: flex;
 align-items: center;
 gap: 10px;
 padding: 6px 0;
 border-top: 1px solid rgba(192,57,43,0.15);
 font-size: 13px;
 transition: background 0.15s;
 }
 .agotado-item:first-of-type { border-top: none; }

 /* ── EMPTY STATE ── */
 .empty-state {
 text-align: center;
 padding: 48px 20px;
 color: var(--gris-medio);
 animation: fadeScaleIn 0.4s var(--ease-spring) both;
 }
 .empty-state .emoji { font-size: 44px; margin-bottom: 10px; }
 .empty-state .emoji .icono-svg { width: 44px; height: 44px; color: var(--gris-medio); }

 .timestamp {
 text-align: center;
 font-size: 11px;
 color: var(--gris-medio);
 margin-top: 16px;
 }
 
 .btn-volver {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 width: 36px; height: 36px;
 border-radius: 50%;
 background: rgba(255,255,255,0.15);
 border: 1px solid rgba(255,255,255,0.25);
 color: var(--blanco, #fff);
 transition: background 0.2s, transform 0.15s;
 text-decoration: none;
 }
 .btn-volver:hover { background: rgba(255,255,255,0.28); }
 .btn-volver:active { transform: scale(0.92); }

 /* ── VACIAR INVENTARIO (solo CEO) ── */
 .acciones-inv {
 display: flex;
 justify-content: flex-end;
 margin-bottom: 14px;
 }
 .acciones-inv[hidden] { display: none; }
 .btn:disabled { opacity: 0.45; cursor: not-allowed; }
 .vaciar-codigo {
 font-family: monospace;
 font-weight: 700;
 background: var(--gris-suave);
 padding: 1px 6px;
 border-radius: 6px;
 user-select: all;
 }

 /* ── MODAL ── */
 .modal-overlay {
 position: fixed; inset: 0;
 background: rgba(0,0,0,0.45);
 display: flex; align-items: flex-end; justify-content: center;
 z-index: 200;
 opacity: 0; pointer-events: none;
 transition: opacity 0.25s var(--ease-in-out);
 }
 .modal-overlay.show { opacity: 1; pointer-events: all; }
 .modal {
 background: #fff;
 border-radius: 20px 20px 0 0;
 padding: 24px 20px 28px;
 width: 100%;
 max-width: 520px;
 transform: translateY(100%);
 transition: transform 0.38s cubic-bezier(0.34, 1.28, 0.64, 1);
 max-height: 90vh;
 overflow-y: auto;
 min-width: 0;
 overscroll-behavior: contain;
 }
 .modal-overlay.show .modal { transform: translateY(0); }
 .modal-titulo {
 font-size: 16px;
 font-weight: 700;
 color: var(--rojo);
 margin-bottom: 16px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 }
 .btn-cerrar-modal {
 background: var(--gris-suave);
 border: none;
 border-radius: 50%;
 width: 32px; height: 32px;
 cursor: pointer;
 display: flex; align-items: center; justify-content: center;
 transition: background 0.2s, transform 0.15s var(--ease-spring);
 }
 .btn-cerrar-modal:hover { background: var(--gris-borde); }
 .btn-cerrar-modal:active { transform: scale(0.88); }
 @media(max-width:600px) {
   .alertas-bar { gap:7px; margin-bottom:14px; }
   .alerta-stat { min-width:0; padding:12px 5px; border-radius:14px; }
   .alerta-stat .num { font-size:22px; }
   .alerta-stat .lbl { font-size:9px; letter-spacing:0; }
   .inv-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
   .inv-card { min-width:0; padding:13px 8px; border-radius:14px; }
   .inv-nombre { overflow-wrap:anywhere; }
   .agotados-banner { padding:13px 14px; }
 }
 @media(max-width:340px) {
   .inv-grid { grid-template-columns:minmax(0,1fr); }
 }
 </style>
  <script type="speculationrules">

  </script>

<body>
 <div class="topbar">
 <h1>Inventario</h1>
 <a href="../../../panel/dashboard.html" class="btn-volver" title="Volver"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
 </div>

 <div class="container">

 <!-- Resumen de alertas -->
 <div class="alertas-bar">
 <div class="alerta-stat">
 <div class="num num-ok" id="stat-ok">—</div>
 <div class="lbl">En stock</div>
 </div>
 <div class="alerta-stat">
 <div class="num num-alerta" id="stat-alerta">—</div>
 <div class="lbl">Bajo</div>
 </div>
 <div class="alerta-stat">
 <div class="num num-agotado" id="stat-agotado">—</div>
 <div class="lbl"> Agotado</div>
 </div>
 </div>

 <!-- Vaciar inventario: se muestra solo al rol CEO -->
 <div class="alerta" id="vaciar-resultado"></div>
 <div class="acciones-inv" id="acciones-inv" hidden>
 <button class="btn btn-danger btn-sm" id="btn-vaciar">Vaciar</button>
 </div>

 <!-- Buscador -->
 <div class="buscador-wrap">
 <span class="icono-buscar"></span>
 <input type="text" id="buscador" placeholder="Buscar producto..."/>
 </div>

 <!-- Spinner inicial -->
 <div class="spinner-wrap" id="spinner-inv"><div class="spinner"></div></div>

 <!-- Contenido principal -->
 <div id="inv-contenido" style="display:none"></div>

 <div class="timestamp" id="timestamp"></div>
 </div>

 <!-- ══ MODAL VACIAR INVENTARIO ══ -->
 <div class="modal-overlay" id="modal-vaciar">
 <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-vaciar-titulo">
 <div class="modal-titulo">
 <span id="modal-vaciar-titulo"><img src="../../../img/iconos/advertencia.svg" class="icono-svg" alt=""/> Vaciar inventario</span>
 <button class="btn-cerrar-modal" id="cerrar-modal-vaciar" title="Cerrar"><img src="../../../img/iconos/cerrar.svg" class="icono-svg" alt=""/></button>
 </div>
 <p style="font-size:14px;color:var(--gris-texto);margin-bottom:10px;">
 Todos los productos quedarán con stock <strong>0</strong>.
 </p>
 <p style="font-size:13px;color:var(--gris-medio);margin-bottom:16px;">
 No se registrará merma ni se modificarán el fondo, las ventas ni las compras.
 Esta acción no se puede deshacer.
 </p>
 <div class="alerta alerta-error" id="vaciar-error"></div>
 <div class="form-group">
 <label for="vaciar-confirm-input">Para confirmar, escribe <span class="vaciar-codigo">vaciar_inventario</span></label>
 <input type="text" id="vaciar-confirm-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"/>
 </div>
 <div style="display:flex;gap:10px;">
 <button class="btn btn-danger" id="btn-vaciar-ok" disabled>Vaciar inventario</button>
 <button class="btn btn-outline" id="btn-vaciar-cancel">Cancelar</button>
 </div>
 </div>
 </div>

 <script type="module">
 import { guardRoute, requirePermiso, getUsuarioActual } from "../../../js/core/auth.js";
 import { escucharCategorias, getIconoHTML, estadoStock } from "../../../js/modulos/catalogo.js";
 import { db } from "../../../js/core/firebase-config.js";
 import { escaparHtml } from "../../../js/core/seguridad.js";
 import { vaciarInventario } from "../../../js/core/operaciones.js";
 import {
 collection, query, where, onSnapshot
 } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

 guardRoute();
 await requirePermiso("ver_inventario");

 let categorias = [];
 let todosProductos = [];
 let terminoBusqueda = "";
 const h = escaparHtml;

 function unidadesPorCajaProducto(producto) {
 const candidato = Number(producto.unidadesPorCaja ?? producto.unidadesPorPaquete ?? producto.cantidadPorPaquete ?? 12);
 return Number.isFinite(candidato) && candidato > 0 ? Math.trunc(candidato) : 12;
 }

 function formatearEquivalenciaStock(stock, producto) {
 const unidadesCaja = unidadesPorCajaProducto(producto);
 if (stock <= 0 || !unidadesCaja) return "";
 const cajas = Math.trunc(stock / unidadesCaja);
 const unidades = stock % unidadesCaja;
 const pluralStock = stock === 1 ? "unidad" : "unidades";
 return `${stock} ${pluralStock} ${stock === 1 ? "=" : "="}${cajas} caja${cajas === 1 ? "" : "s"} y ${unidades} unidad${unidades === 1 ? "" : "es"} disponibles`;
 }

 const contenido = document.getElementById("inv-contenido");
 const spinner = document.getElementById("spinner-inv");

 // Escuchar TODOS los productos activos en tiempo real
 onSnapshot(
 query(collection(db, "productos"), where("activo", "==", true)),
 (snap) => {
 todosProductos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
 actualizarStats();
 renderInventario();
 }
 );

 escucharCategorias((cats) => {
 categorias = cats;
 spinner.style.display = "none";
 contenido.style.display = "";
 renderInventario();
 });

 function actualizarStats() {
 let ok = 0, alerta = 0, agotado = 0;
 todosProductos.forEach(p => {
 const e = estadoStock(p.stock ?? 0, p.alertaMinima ?? 0);
 if (e === "ok") ok++;
 else if (e === "alerta") alerta++;
 else if (e === "agotado") agotado++;
 });
 document.getElementById("stat-ok").textContent = ok;
 document.getElementById("stat-alerta").textContent = alerta;
 document.getElementById("stat-agotado").textContent = agotado;
 document.getElementById("timestamp").textContent =
 `Última actualización: ${new Date().toLocaleTimeString("es-PA")}`;
 }

 function renderInventario() {
 const busq = terminoBusqueda.toLowerCase();
 const agotados = todosProductos.filter(p => {
 const e = estadoStock(p.stock ?? 0, p.alertaMinima ?? 0);
 return e === "agotado" && (!busq || String(p.nombre || "").toLowerCase().includes(busq));
 });

 contenido.innerHTML = "";

 // Banner de agotados arriba (solo si no hay búsqueda activa)
 if (agotados.length > 0 && !busq) {
 const banner = document.createElement("div");
 banner.className = "agotados-banner";
 banner.innerHTML = `
 <div class="agotados-banner-titulo"> Productos agotados (${agotados.length})</div>
 ${agotados.map(p => `
 <div class="agotado-item">
 <span>${getIconoHTML(p.iconoId, { clase: "icono-md" })}</span>
 <span style="font-weight:600;flex:1;">${h(p.nombre)}</span>
 <span class="inv-badge-agotado">Sin stock</span>
 </div>`).join("")}`;
 contenido.appendChild(banner);
 }

 // Productos por categoría con delay escalonado
 let totalVisible = 0;
 let cardGlobal = 0;

 categorias.forEach(cat => {
 const prods = todosProductos.filter(p =>
 p.categoriaId === cat.id &&
 (!busq || String(p.nombre || "").toLowerCase().includes(busq))
 );
 if (prods.length === 0) return;
 totalVisible += prods.length;

 const seccion = document.createElement("div");
 seccion.className = "seccion-cat";

 const titulo = document.createElement("div");
 titulo.className = "seccion-cat-titulo";
 titulo.innerHTML = `
 <span>${getIconoHTML(cat.iconoId, { clase: "icono-md" })}</span>
 ${h(cat.nombre)}
 <span style="font-size:12px;font-weight:400;color:var(--gris-medio);margin-left:4px;">(${prods.length})</span>`;
 seccion.appendChild(titulo);

 const grid = document.createElement("div");
 grid.className = "inv-grid";

 // Ordenar: agotados → alerta → ok
 const ordenados = [...prods].sort((a, b) => {
 const orden = { agotado: 0, alerta: 1, ok: 2 };
 return orden[estadoStock(a.stock ?? 0, a.alertaMinima ?? 0)] -
 orden[estadoStock(b.stock ?? 0, b.alertaMinima ?? 0)];
 });

 ordenados.forEach(prod => {
 const estado = estadoStock(prod.stock ?? 0, prod.alertaMinima ?? 0);
 const card = document.createElement("div");
 card.className = `inv-card${estado !== "ok" ? ` ${estado}` : ""}`;
 // Delay escalonado global para cascada de toda la página
 card.style.animationDelay = `${0.35 + cardGlobal * 0.045}s`;
 cardGlobal++;

 card.innerHTML = `
 <div class="inv-emoji">${getIconoHTML(prod.iconoId, { clase: "icono-lg" })}</div>
 <div class="inv-nombre">${h(prod.nombre)}</div>
 <div class="inv-stock ${estado}">
 ${estado === "agotado" ? "0" : prod.stock ?? 0}
 </div>
 <div class="inv-alerta-lbl">
 ${estado === "agotado"
 ? '<span class="inv-badge-agotado">Sin stock</span>'
 : estado === "alerta"
 ? `Mínimo: ${prod.alertaMinima}`
 : `Mínimo: ${prod.alertaMinima}`}
 ${estado !== "agotado" && (prod.stock ?? 0) > 0
 ? `<div style="margin-top:4px;font-size:10px;color:var(--gris-medio);line-height:1.3;">${formatearEquivalenciaStock(prod.stock ?? 0, prod)}</div>`
 : ""}
 </div>`;

 grid.appendChild(card);
 });

 seccion.appendChild(grid);
 contenido.appendChild(seccion);
 });

 // Si no hay resultados
 if (totalVisible === 0) {
 contenido.innerHTML += `
 <div class="empty-state">
 <div class="emoji">${busq ? "" : ""}</div>
 <p>${busq
 ? `No se encontraron productos con "${h(terminoBusqueda)}".`
 : "No hay productos en el inventario aún.<br>Crea categorías y productos en el Catálogo."}</p>
 </div>`;
 }
 }

 document.getElementById("buscador").addEventListener("input", (e) => {
 terminoBusqueda = e.target.value;
 renderInventario();
 });

 // ── VACIAR INVENTARIO (solo CEO) ─────────────────────────────────────────
 // Ocultar el botón es solo comodidad: la Cloud Function vuelve a exigir
 // rol CEO y el texto de confirmación antes de tocar el stock.
 const CONFIRMACION_VACIAR = "vaciar_inventario";
 const modalVaciar = document.getElementById("modal-vaciar");
 const inputVaciar = document.getElementById("vaciar-confirm-input");
 const btnVaciarOk = document.getElementById("btn-vaciar-ok");
 const errorVaciar = document.getElementById("vaciar-error");
 const resultadoVaciar = document.getElementById("vaciar-resultado");
 let vaciando = false;

 if (getUsuarioActual().rol === "ceo") {
 document.getElementById("acciones-inv").hidden = false;
 }

 function abrirModalVaciar() {
 inputVaciar.value = "";
 btnVaciarOk.disabled = true;
 btnVaciarOk.textContent = "Vaciar inventario";
 errorVaciar.classList.remove("show");
 modalVaciar.classList.add("show");
 setTimeout(() => inputVaciar.focus(), 150);
 }

 function cerrarModalVaciar() {
 if (vaciando) return;
 modalVaciar.classList.remove("show");
 }

 document.getElementById("btn-vaciar").addEventListener("click", abrirModalVaciar);
 document.getElementById("btn-vaciar-cancel").addEventListener("click", cerrarModalVaciar);
 document.getElementById("cerrar-modal-vaciar").addEventListener("click", cerrarModalVaciar);
 modalVaciar.addEventListener("click", (e) => {
 if (e.target === modalVaciar) cerrarModalVaciar();
 });
 document.addEventListener("keydown", (e) => {
 if (e.key === "Escape" && modalVaciar.classList.contains("show")) cerrarModalVaciar();
 });

 inputVaciar.addEventListener("input", () => {
 btnVaciarOk.disabled = vaciando || inputVaciar.value.trim() !== CONFIRMACION_VACIAR;
 });
 inputVaciar.addEventListener("keydown", (e) => {
 if (e.key === "Enter" && !btnVaciarOk.disabled) btnVaciarOk.click();
 });

 btnVaciarOk.addEventListener("click", async () => {
 if (vaciando || inputVaciar.value.trim() !== CONFIRMACION_VACIAR) return;
 vaciando = true;
 btnVaciarOk.disabled = true;
 btnVaciarOk.textContent = "Vaciando...";
 errorVaciar.classList.remove("show");
 try {
 const { productosVaciados = 0 } = await vaciarInventario({ confirmacion: CONFIRMACION_VACIAR });
 vaciando = false;
 cerrarModalVaciar();
 resultadoVaciar.textContent = productosVaciados > 0
 ? `Inventario vaciado: ${productosVaciados} producto${productosVaciados === 1 ? "" : "s"} quedaron en 0.`
 : "El inventario ya estaba en 0.";
 resultadoVaciar.className = "alerta alerta-success show";
 } catch (error) {
 vaciando = false;
 errorVaciar.textContent = error.message || "No se pudo vaciar el inventario.";
 errorVaciar.classList.add("show");
 btnVaciarOk.textContent = "Vaciar inventario";
 btnVaciarOk.disabled = inputVaciar.value.trim() !== CONFIRMACION_VACIAR;
 }
 });
 </script>
</body>
