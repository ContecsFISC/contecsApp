<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>CONTECS — Ventas 2</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300722e'/%3E%3Cpath d='M16 22h32v6H16zm0 14h20v6H16z' fill='white'/%3E%3C/svg%3E"/>
	<link rel="stylesheet" href="../../../css/styles.css"/>
	<style>
		.panel-resumen {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			gap: 12px;
			margin-bottom: 16px;
		}
		.resumen-box {
			background: #fff;
			border-radius: 14px;
			padding: 16px;
			box-shadow: var(--sombra-sm);
			border-left: 3px solid var(--verde-claro);
		}
		.resumen-box .lbl { font-size: 12px; color: var(--gris-medio); margin-bottom: 4px; }
		.resumen-box .val { font-size: 21px; font-weight: 800; color: var(--verde-oscuro); }
		.venta-grid {
			display: grid;
			grid-template-columns: 1fr;
			gap: 10px;
		}
		.seccion-cat { margin-bottom: 18px; }
		.seccion-cat-titulo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--verde-oscuro); margin-bottom: 10px; }
		.venta-card {
			background: #fff;
			border-radius: 14px;
			box-shadow: var(--sombra-sm);
			padding: 14px;
			display: flex;
			align-items: center;
			gap: 12px;
			border-left: 3px solid var(--verde-claro);
		}
		.venta-card.alerta { border-left-color: var(--amarillo); }
		.venta-card.agotado { border-left-color: var(--rojo); opacity: 0.92; }
		.venta-icono { font-size: 28px; line-height: 1; }
		.venta-info { flex: 1; min-width: 0; }
		.venta-nombre, .carrito-nombre { font-weight: 700; color: var(--gris-texto); }
		.venta-meta, .carrito-meta { font-size: 12px; color: var(--gris-medio); }
		.carrito-item {
			background: #fff;
			border-radius: 14px;
			box-shadow: var(--sombra-sm);
			padding: 14px;
			margin-bottom: 10px;
		}
		.carrito-controles { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
		.chip-btn {
			border: 1px solid var(--gris-borde);
			border-radius: 999px;
			background: #fff;
			padding: 7px 12px;
			font-size: 13px;
			cursor: pointer;
		}
		.chip-danger { border-color: rgba(192,57,43,0.25); color: var(--rojo); }
		.carrito-campos {
			display: grid;
			grid-template-columns: 1fr;
			gap: 10px;
			margin-top: 12px;
		}
		.carrito-merma-box {
			border: 1px dashed rgba(192,57,43,0.3);
			border-radius: 12px;
			padding: 10px 12px;
			background: rgba(192,57,43,0.06);
		}
		.merma-toggle {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
			font-weight: 700;
			color: var(--rojo);
		}
		.merma-input-wrap {
			margin-top: 8px;
		}
		.merma-input-wrap.is-hidden {
			display: none;
		}
		.campo-error {
			display: none;
			color: var(--rojo);
			font-size: 12px;
			margin-top: 4px;
		}
		.campo-error.show {
			display: block;
		}
		.carrito-resumen-item {
			margin-top: 10px;
			padding: 10px 12px;
			border-radius: 12px;
			background: var(--verde-fondo);
			color: var(--verde-oscuro);
			font-size: 13px;
			font-weight: 600;
		}
		.carrito-warn {
			color: var(--rojo);
			font-size: 12px;
			margin-top: 8px;
		}
		.nota-seccion {
			margin-top: 14px;
		}
		.fondo-box {
			border: 1px dashed var(--gris-borde);
			border-radius: 14px;
			padding: 14px;
			background: rgba(255,255,255,0.7);
			margin-top: 14px;
		}
		.fondo-ayuda {
			font-size: 12px;
			color: var(--gris-medio);
			margin-top: 6px;
		}
		@media (min-width: 680px) {
			.panel-resumen { grid-template-columns: 1fr 1fr; }
			.venta-grid { grid-template-columns: 1fr 1fr; }
			.carrito-campos { grid-template-columns: 1fr 1fr; }
		}
	
 .btn-volver {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 width: 36px; height: 36px;
 border-radius: 50%;
 background: rgba(255,255,255,0.15);
 border: 1px solid rgba(255,255,255,0.25);
 color: var(--blanco, #fff);
 transition: background 0.2s, transform 0.15s;
 text-decoration: none;
 }
 .btn-volver:hover { background: rgba(255,255,255,0.28); }
 .btn-volver:active { transform: scale(0.92); }
 </style>
</head>
<body>
	<div class="topbar">
		<h1>Ventas 2</h1>
		<a href="../../../panel/dashboard.html" class="btn-volver" title="Volver"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
	</div>

	 <!-- ACCESO RÁPIDO CALENDARIO -->
	<div style="margin-bottom:16px;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;">
		<a href="../logistica/actividadVentas.html" class="btn btn-outline" style="width:auto;display:inline-flex;align-items:center;gap:8px;color:var(--verde-oscuro);border-color:var(--verde-claro);">
		 Crear actividad de venta
		</a>
		<a href="ventaRapida.html" class="btn btn-primary" style="width:auto;display:inline-flex;align-items:center;gap:8px;">
		 ⚡ Venta rápida
		</a>
	</div>
	<div class="container">
		<div class="alerta alerta-error" id="alerta-venta"></div>

		<div class="card">
			<div class="card-title">Resumen</div>
			<div class="panel-resumen">
				<div class="resumen-box">
					<div class="lbl">Unidades vendidas</div>
					<div class="val" id="resumen-vendidas">0</div>
				</div>
				<div class="resumen-box">
					<div class="lbl">Total venta</div>
					<div class="val" id="resumen-total">$0.00</div>
				</div>
				<div class="resumen-box">
					<div class="lbl">Ganancia estimada</div>
					<div class="val" id="resumen-ganancia">$0.00</div>
				</div>
			</div>
			<button type="button" class="btn btn-outline btn-sm" id="btn-limpiar-carrito">Vaciar carrito</button>
		</div>

		<div class="spinner-wrap" id="estado-carga"><div class="spinner"></div></div>

		<div id="pantalla-venta" class="is-hidden">
			<div class="card">
				<div class="card-title">Actividad de Ventas</div>
				<div class="form-group">
					<label for="sel-actividad">Selecciona la actividad</label>
					<select id="sel-actividad" aria-label="Actividad de ventas">
						<option value="">— Cargando actividades… —</option>
					</select>
				</div>
				<div id="actividad-info" style="display:none; padding:10px 12px; background:var(--verde-fondo); border-radius:10px; font-size:13px; color:var(--gris-medio);"></div>
			</div>

			<div class="card">
				<div class="card-title">Buscar productos</div>
				<div class="form-group">
					<input type="text" id="buscador-productos" placeholder="Buscar por nombre..."/>
				</div>
				<div id="combos-wrap"></div>
				<div id="productos-wrap"></div>
			</div>

			<div class="card">
				<div class="card-title">Carrito</div>
				<div id="carrito-combos-wrap"></div>
				<div id="carrito-wrap"></div>

				<div class="form-group">
					<label for="metodo-pago">Método de pago</label>
					<select id="metodo-pago" aria-label="Método de pago de la venta">
						<option value="efectivo">Efectivo</option>
						<option value="tarjeta">Tarjeta</option>
						<option value="transferencia">Transferencia</option>
					</select>
				</div>

				<div class="form-group nota-seccion">
					<label>Nota</label>
					<textarea id="nota-venta" rows="3" placeholder="Observaciones opcionales..."></textarea>
				</div>
				<button class="btn btn-primary" id="btn-finalizar-venta">Registrar venta</button>
			</div>
		</div>
	</div>
	<script type="module" src="../../../js/modulos/ventas2.js"></script>
</body>
</html>
