<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>CONTECS — Bitácora</title>
 <link rel="stylesheet" href="../../../css/styles.css"/>
 <style>
 /* ── Botón de volver estético ── */
 .btn-volver {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 width: 36px;
 height: 36px;
 border-radius: 50%;
 background: rgba(255,255,255,0.18);
 border: 2px solid rgba(255,255,255,0.55);
 color: #fff;
 font-size: 17px;
 font-weight: 900;
 text-decoration: none;
 transition: background 0.18s, border-color 0.18s, transform 0.15s;
 flex-shrink: 0;
 line-height: 1;
 cursor: pointer;
 }
 .btn-volver:hover {
 background: rgba(255,255,255,0.32);
 border-color: #fff;
 transform: scale(1.08);
 }
 /* ── TABS ── */
 .tabs {
 display: flex;
 gap: 8px;
 margin-bottom: 20px;
 border-bottom: 2px solid var(--gris-borde);
 overflow-x: auto;
 }
 .tab-btn {
 padding: 10px 18px;
 border: none;
 background: none;
 font-size: 14px;
 font-weight: 600;
 color: var(--gris-medio);
 cursor: pointer;
 border-bottom: 3px solid transparent;
 margin-bottom: -2px;
 transition: color 0.2s, border-color 0.2s;
 white-space: nowrap;
 }
 .tab-btn.activo { color: var(--verde); border-bottom-color: var(--verde); }

 /* ── CARDS COLAPSABLES ── */
 .bita-card {
 background: #fff;
 border-radius: var(--radio);
 box-shadow: var(--sombra-sm);
 margin-bottom: 10px;
 border-left: 3px solid var(--verde-claro);
 overflow: hidden;
 animation: fadeScaleIn 0.3s var(--ease-out) both;
 }
 .bita-header {
 display: flex;
 align-items: center;
 justify-content: space-between;
 padding: 14px 16px;
 cursor: pointer;
 gap: 8px;
 -webkit-user-select: none;
 user-select: none;
 }
 .bita-header:hover { background: var(--gris-suave); }
 .bita-meta { flex: 1; min-width: 0; }
 .bita-fecha { font-size: 12px; color: var(--gris-medio); margin-bottom: 2px; }
 .bita-usuario { font-size: 13px; font-weight: 600; color: var(--gris-texto); }
 .bita-total {
 font-size: 16px;
 font-weight: 700;
 color: var(--verde);
 white-space: nowrap;
 }
 .bita-metodo {
 font-size: 11px;
 background: var(--verde-fondo);
 color: var(--verde-oscuro);
 padding: 3px 8px;
 border-radius: 20px;
 white-space: nowrap;
 }
 .bita-chevron {
 font-size: 12px;
 color: var(--gris-medio);
 transition: transform 0.25s;
 }
 .bita-card.abierto .bita-chevron { transform: rotate(180deg); }

 .bita-body {
 display: none;
 padding: 0 16px 16px;
 border-top: 1px solid var(--gris-borde);
 }
 .bita-card.abierto .bita-body { display: block; }

 .items-tabla {
 width: 100%;
 border-collapse: collapse;
 font-size: 13px;
 margin-top: 10px;
 }
 .items-tabla th {
 text-align: left;
 color: var(--gris-medio);
 font-weight: 600;
 padding: 6px 8px;
 border-bottom: 1px solid var(--gris-borde);
 }
 .items-tabla td {
 padding: 7px 8px;
 border-bottom: 1px solid #f0f4f1;
 color: var(--gris-texto);
 }
 .items-tabla tr:last-child td { border-bottom: none; }
 .items-tabla .num { text-align: right; }
 .factura-link {
 display: inline-flex;
 align-items: center;
 gap: 6px;
 margin-top: 10px;
 font-size: 13px;
 color: var(--verde);
 text-decoration: none;
 padding: 6px 12px;
 border-radius: var(--radio-sm);
 background: var(--verde-fondo);
 border: 1px solid var(--verde-claro);
 }
 .factura-link:hover { background: #d0ecd8; }

 /* ── LISTA SIMPLE (fondos e inventario) ── */
 .mov-item {
 display: flex;
 align-items: flex-start;
 gap: 12px;
 padding: 12px 14px;
 background: #fff;
 border-radius: var(--radio);
 box-shadow: var(--sombra-sm);
 margin-bottom: 8px;
 animation: fadeScaleIn 0.3s var(--ease-out) both;
 }
 .mov-icono {
 width: 32px;
 height: 32px;
 border-radius: 50%;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 15px;
 flex-shrink: 0;
 }
 .mov-icono.entrada { background: var(--verde-fondo); }
 .mov-icono.salida { background: var(--rojo-fondo); }
 .mov-info { flex: 1; min-width: 0; }
 .mov-titulo { font-size: 14px; font-weight: 600; color: var(--gris-texto); }
 .mov-detalle { font-size: 12px; color: var(--gris-medio); margin-top: 2px; }
 .mov-monto {
 font-size: 15px;
 font-weight: 700;
 white-space: nowrap;
 flex-shrink: 0;
 }
 .mov-monto.ingreso { color: var(--verde); }
 .mov-monto.egreso { color: var(--rojo); }

 /* ── STOCK BADGE ── */
 .stock-badge {
 display: inline-block;
 font-size: 11px;
 padding: 2px 8px;
 border-radius: 20px;
 font-weight: 600;
 }
 .stock-badge.entrada { background: var(--verde-fondo); color: var(--verde-oscuro); }
 .stock-badge.salida { background: var(--rojo-fondo); color: var(--rojo); }

 /* ── RESUMEN FONDOS ── */
 .fondos-resumen {
 display: grid;
 grid-template-columns: repeat(4, 1fr);
 gap: 12px;
 margin-bottom: 20px;
 }
 @media (max-width: 800px) { .fondos-resumen { grid-template-columns: repeat(2, 1fr); } }
 @media (max-width: 480px) { .fondos-resumen { grid-template-columns: 1fr; } }
 .fondos-stat {
 background: #fff;
 border: 1px solid #e0e7e3;
 border-radius: 12px;
 padding: 14px 16px;
 }
 .fondos-stat-label {
 font-size: 11px;
 font-weight: 600;
 color: #8a9e8d;
 text-transform: uppercase;
 letter-spacing: .5px;
 margin-bottom: 6px;
 }
 .fondos-stat-valor {
 font-size: 20px;
 font-weight: 700;
 }
 .fondos-stat-valor.ingreso { color: var(--verde-oscuro); }
 .fondos-stat-valor.egreso { color: var(--rojo); }
 .fondos-stat-valor.neutro { color: var(--gris-texto); }
 .fondos-seccion-titulo {
 font-size: 11px;
 font-weight: 700;
 color: #8a9e8d;
 letter-spacing: 1px;
 text-transform: uppercase;
 margin-bottom: 12px;
 }

 /* ── SPINNER SECCION ── */
 .tab-spinner {
 display: flex;
 justify-content: center;
 padding: 40px;
 }

 .tab-oculta {
 display: none;
 }

 /* ── FILTROS VENTAS ── */
 .ventas-filtros {
 display: flex;
 flex-wrap: wrap;
 gap: 12px;
 margin-bottom: 14px;
 align-items: flex-end;
 }
 .ventas-filtros .form-group { flex: 1; min-width: 180px; margin-bottom: 0; }
 .ventas-filtros .btn { flex-shrink: 0; }
 .ventas-resumen-filtro {
 display: flex;
 justify-content: space-between;
 align-items: center;
 font-size: 13px;
 color: var(--gris-medio);
 background: var(--gris-suave);
 border-radius: var(--radio-sm);
 padding: 8px 12px;
 margin-bottom: 14px;
 }
 .ventas-resumen-filtro strong { color: var(--verde-oscuro); font-size: 14px; }

 /* ── Botón corregir (solo CEO) ── */
 .btn-corregir {
 background: var(--gris-suave);
 border: 1px solid var(--gris-borde);
 color: var(--gris-texto);
 font-size: 12px;
 font-weight: 600;
 padding: 5px 10px;
 border-radius: 20px;
 cursor: pointer;
 white-space: nowrap;
 transition: background 0.18s, border-color 0.18s;
 }
 .btn-corregir:hover { background: #fff3cd; border-color: #ffe08a; }

 /* ── Modal de corrección ── */
 .modal-overlay {
 position: fixed;
 inset: 0;
 background: rgba(0,0,0,0.45);
 display: flex;
 align-items: flex-end;
 justify-content: center;
 z-index: 300;
 opacity: 0;
 pointer-events: none;
 transition: opacity 0.25s ease;
 }
 .modal-overlay.show { opacity: 1; pointer-events: all; }
 .modal-overlay .modal {
 background: #fff;
 border-radius: 20px 20px 0 0;
 padding: 22px 18px 32px;
 width: 100%;
 max-width: 640px;
 max-height: 92vh;
 overflow-y: auto;
 transform: translateY(100%);
 transition: transform 0.35s cubic-bezier(0.34, 1.28, 0.64, 1);
 }
 .modal-overlay.show .modal { transform: translateY(0); }
 .modal-titulo {
 font-size: 16px;
 font-weight: 700;
 color: var(--verde-oscuro);
 margin-bottom: 16px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 12px;
 }
 .btn-cerrar-modal {
 background: var(--gris-suave);
 border: none;
 border-radius: 50%;
 width: 32px;
 height: 32px;
 font-size: 16px;
 cursor: pointer;
 flex-shrink: 0;
 }
 .correccion-aviso {
 font-size: 12px;
 color: #8a6d00;
 background: #fff8e1;
 border: 1px solid #ffe08a;
 border-radius: 10px;
 padding: 8px 10px;
 margin-bottom: 14px;
 }
 .correccion-tabla {
 width: 100%;
 border-collapse: collapse;
 font-size: 13px;
 margin-bottom: 10px;
 }
 .correccion-tabla th {
 text-align: left;
 font-size: 11px;
 color: var(--gris-medio);
 padding: 4px 6px;
 }
 .correccion-tabla td {
 padding: 4px 6px;
 vertical-align: middle;
 }
 .correccion-tabla input[type="number"], .correccion-tabla input[type="text"] {
 width: 100%;
 padding: 6px 8px;
 border: 1px solid var(--gris-borde);
 border-radius: 8px;
 font-size: 13px;
 }
 .correccion-quitar {
 background: var(--rojo-fondo);
 color: var(--rojo);
 border: none;
 border-radius: 8px;
 width: 28px;
 height: 28px;
 cursor: pointer;
 font-size: 13px;
 }
 .correccion-agregar-fila {
 display: flex;
 gap: 8px;
 margin-bottom: 14px;
 flex-wrap: wrap;
 }
 .correccion-agregar-fila select { flex: 1; min-width: 180px; }
 .correccion-total {
 display: flex;
 justify-content: space-between;
 font-weight: 700;
 color: var(--verde-oscuro);
 padding: 10px 0;
 border-top: 1px solid var(--gris-borde);
 margin-bottom: 10px;
 }
 </style>
</head>
<body>
 <div class="topbar">
 <h1> Bitácora</h1>
 <a href="../../../panel/dashboard.html" class="btn-volver" title="Volver"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
 </div>

 <div class="container">
 <div class="seccion-titulo">Historial de operaciones</div>

 <div class="tabs">
 <button class="tab-btn activo" data-tab="ventas"> Ventas</button>
 <button class="tab-btn" data-tab="compras"> Compras</button>
 <button class="tab-btn" data-tab="fondos"> Fondos</button>
 <button class="tab-btn" data-tab="inventario"> Inventario</button>
 <button class="tab-btn" data-tab="mermas">️ Mermas</button>
 </div>

 <div id="tab-ventas">
 <div class="ventas-filtros">
 <div class="form-group">
 <label for="filtro-actividad-venta">Actividad de venta</label>
 <select id="filtro-actividad-venta" aria-label="Filtrar por actividad de venta">
 <option value="">Todas las actividades</option>
 </select>
 </div>
 <div class="form-group">
 <label for="filtro-fecha-venta">Día</label>
 <input type="date" id="filtro-fecha-venta" aria-label="Filtrar por día"/>
 </div>
 <button type="button" class="btn btn-outline btn-sm" id="btn-limpiar-filtros-venta">Limpiar filtros</button>
 </div>
 <div class="ventas-resumen-filtro" id="ventas-resumen-filtro"></div>
 <div id="ventas-lista">
 <div class="tab-spinner"><div class="spinner"></div></div>
 </div>
 </div>
 <div id="tab-compras" class="tab-oculta">
 <div class="ventas-filtros">
 <div class="form-group">
 <label for="filtro-fecha-compra">Día</label>
 <input type="date" id="filtro-fecha-compra" aria-label="Filtrar por día"/>
 </div>
 <button type="button" class="btn btn-outline btn-sm" id="btn-limpiar-filtros-compra">Limpiar filtros</button>
 </div>
 <div class="ventas-resumen-filtro" id="compras-resumen-filtro"></div>
 <div id="compras-lista">
 <div class="tab-spinner"><div class="spinner"></div></div>
 </div>
 </div>
 <div id="tab-fondos" class="tab-oculta">
 <div class="tab-spinner"><div class="spinner"></div></div>
 </div>
 <div id="tab-inventario" class="tab-oculta">
 <div class="tab-spinner"><div class="spinner"></div></div>
 </div>
 <div id="tab-mermas" class="tab-oculta">
 <div class="tab-spinner"><div class="spinner"></div></div>
 </div>
 </div>

 <div class="modal-overlay" id="modal-correccion">
 <div class="modal">
 <div class="modal-titulo">
 <span id="correccion-titulo">Corregir operación</span>
 <button class="btn-cerrar-modal" id="cerrar-modal-correccion" type="button">✕</button>
 </div>

 <div class="correccion-aviso"> Esta corrección reescribe el registro y ajusta el stock y el fondo por la diferencia. Explica el motivo para dejar rastro de auditoría.</div>

 <div class="form-group" id="correccion-proveedor-wrap" style="display:none;">
 <label for="correccion-proveedor">Proveedor</label>
 <input type="text" id="correccion-proveedor" placeholder="Ej: PriceSmart"/>
 </div>

 <div style="overflow-x:auto;">
 <table class="correccion-tabla">
 <thead id="correccion-thead">
 <tr>
 <th>Producto</th>
 <th style="width:70px;">Cant.</th>
 <th style="width:90px;">P/U</th>
 <th style="width:90px;">Subtotal</th>
 <th style="width:36px;"></th>
 </tr>
 </thead>
 <tbody id="correccion-items-body"></tbody>
 </table>
 </div>

 <div class="correccion-agregar-fila">
 <select id="correccion-select-producto" aria-label="Agregar producto"></select>
 <button type="button" class="btn btn-outline btn-sm" id="correccion-btn-agregar">+ Agregar producto</button>
 </div>

 <div class="correccion-total">
 <span>Total corregido</span>
 <span id="correccion-total-valor">$0.00</span>
 </div>

 <div class="form-group">
 <label for="correccion-metodo">Método de pago</label>
 <select id="correccion-metodo" aria-label="Método de pago">
 <option value="efectivo">Efectivo</option>
 <option value="transferencia">Transferencia</option>
 <option value="tarjeta">Tarjeta</option>
 <option value="yappy">Yappy</option>
 </select>
 </div>

 <div class="form-group">
 <label for="correccion-nota">Nota</label>
 <textarea id="correccion-nota" rows="2" placeholder="Observaciones..."></textarea>
 </div>

 <div class="form-group">
 <label for="correccion-motivo">Motivo de la corrección (obligatorio)</label>
 <textarea id="correccion-motivo" rows="2" placeholder="Ej: Se registró el producto equivocado, el cliente pidió otra cosa."></textarea>
 <span class="campo-error" id="correccion-err-motivo"></span>
 </div>

 <div class="alerta alerta-error" id="correccion-alerta"></div>

 <div style="display:flex;gap:10px;margin-top:6px;">
 <button type="button" class="btn btn-outline" id="correccion-btn-cancelar" style="flex:1;">Cancelar</button>
 <button type="button" class="btn btn-primary" id="correccion-btn-guardar" style="flex:1;">Guardar corrección</button>
 </div>
 </div>
 </div>

 <script type="module">
 import { guardRoute, requirePermiso, usuarioTienePermiso, getUsuarioActual } from "../../../js/core/auth.js";
 import { formatearMoneda, corregirVenta, corregirCompra } from "../../../js/core/operaciones.js";
 import { db } from "../../../js/core/firebase-config.js";
 import {
 collection, query, orderBy, limit, onSnapshot, getDocs, where
 } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

 guardRoute();
 requirePermiso("ver_bitacora");

 const puedeCorregir = usuarioTienePermiso("corregir_operaciones");

 // ── Helper fecha ──────────────────────────────────────────────────────────
 function formatearFecha(ts) {
 if (!ts) return "—";
 const f = ts.toDate ? ts.toDate() : new Date(ts);
 return f.toLocaleDateString("es-PA", {
 day: "2-digit", month: "short", year: "numeric",
 hour: "2-digit", minute: "2-digit"
 });
 }

 // ── Colapsar / expandir ───────────────────────────────────────────────────
 function toggleCard(card) {
 card.classList.toggle("abierto");
 }

 function numeroSeguro(valor) {
 const numero = Number(valor);
 return Number.isFinite(numero) ? numero : 0;
 }

 function utilidadFormateada(valor) {
 const numero = numeroSeguro(valor);
 return `${numero >= 0 ? "+" : "−"}${formatearMoneda(Math.abs(numero))}`;
 }

 function tipoLineaTexto(tipo) {
 if (tipo === "merma_vendida" || tipo === "vendida") return "Merma vendida";
 if (tipo === "merma_sin_vender" || tipo === "sin_vender") return "Merma sin vender";
 return "Venta";
 }

 // ── TABS ─────────────────────────────────────────────────────────────────
 const TABS = ["ventas", "compras", "fondos", "inventario", "mermas"];
 const tabBtns = document.querySelectorAll(".tab-btn");
 tabBtns.forEach(btn => {
 btn.addEventListener("click", () => {
 tabBtns.forEach(b => b.classList.remove("activo"));
 btn.classList.add("activo");
 TABS.forEach(t => {
 const pane = document.getElementById("tab-" + t);
 if (!pane) return;
 if (t === btn.dataset.tab) {
 pane.classList.remove("tab-oculta");
 pane.style.display = "";
 } else {
 pane.classList.add("tab-oculta");
 pane.style.display = "none";
 }
 });
 });
 });

 // ── Unsubs para limpiar listeners si fuera necesario ─────────────────────
 const unsubs = {};

 // ════════════════════════════════════════════════════════════════════════
 // CORRECCIÓN DE VENTAS/COMPRAS (solo CEO — ver permiso corregir_operaciones)
 // ════════════════════════════════════════════════════════════════════════
 let productosCorreccionCache = [];
 if (puedeCorregir) {
 onSnapshot(query(collection(db, "productos"), where("activo", "==", true)), (snap) => {
 productosCorreccionCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
 poblarSelectProductosCorreccion();
 });
 }

 const THEAD_CORRECCION_VENTA = `<tr>
 <th>Producto</th>
 <th style="width:60px;">Cant.</th>
 <th style="width:80px;">P/U</th>
 <th style="width:80px;">Costo</th>
 <th style="width:90px;">Utilidad</th>
 <th style="width:80px;">Subtotal</th>
 <th style="width:36px;"></th>
 </tr>`;
 const THEAD_CORRECCION_COMPRA = `<tr>
 <th>Producto</th>
 <th style="width:64px;">Paquetes</th>
 <th style="width:100px;">Unid./paquete</th>
 <th style="width:80px;">Total unid.</th>
 <th style="width:110px;">Precio x paquete</th>
 <th style="width:100px;">Precio x unidad</th>
 <th style="width:90px;">Total</th>
 <th style="width:36px;"></th>
 </tr>`;

 const modalCorreccion = document.getElementById("modal-correccion");
 const correccionThead = document.getElementById("correccion-thead");
 const correccionTitulo = document.getElementById("correccion-titulo");
 const correccionProveedorWrap = document.getElementById("correccion-proveedor-wrap");
 const correccionProveedor = document.getElementById("correccion-proveedor");
 const correccionItemsBody = document.getElementById("correccion-items-body");
 const correccionSelectProducto = document.getElementById("correccion-select-producto");
 const correccionBtnAgregar = document.getElementById("correccion-btn-agregar");
 const correccionTotalValor = document.getElementById("correccion-total-valor");
 const correccionMetodo = document.getElementById("correccion-metodo");
 const correccionNota = document.getElementById("correccion-nota");
 const correccionMotivo = document.getElementById("correccion-motivo");
 const correccionErrMotivo = document.getElementById("correccion-err-motivo");
 const correccionAlerta = document.getElementById("correccion-alerta");
 const correccionBtnGuardar = document.getElementById("correccion-btn-guardar");
 const correccionBtnCancelar = document.getElementById("correccion-btn-cancelar");
 const cerrarModalCorreccion = document.getElementById("cerrar-modal-correccion");

 const estadoCorreccion = { tipo: null, id: null, items: [] };
 let idCorreccionSeq = 0;

 function poblarSelectProductosCorreccion() {
 if (!correccionSelectProducto) return;
 const seleccionActual = correccionSelectProducto.value;
 correccionSelectProducto.innerHTML = '<option value="">— Selecciona un producto —</option>' +
 productosCorreccionCache
 .slice()
 .sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""))
 .map(p => `<option value="${p.id}">${p.nombre}</option>`).join("");
 if (productosCorreccionCache.some(p => p.id === seleccionActual)) {
 correccionSelectProducto.value = seleccionActual;
 }
 }

 function precioDefaultProducto(producto) {
 if (!producto) return 0;
 if (estadoCorreccion.tipo === "venta") return numeroSeguro(producto.precioVenta);
 return numeroSeguro(producto.precioCompra ?? producto.ultimoCosto ?? producto.precioVenta);
 }

 function totalCorreccion() {
 if (estadoCorreccion.tipo === "compra") {
 return estadoCorreccion.items.reduce((acc, it) => acc + (numeroSeguro(it.cantidadPaquete) * numeroSeguro(it.precioPaquete)), 0);
 }
 return estadoCorreccion.items.reduce((acc, it) => acc + (numeroSeguro(it.cantidad) * numeroSeguro(it.precioUnitario)), 0);
 }

 function wireInputsYQuitarCorreccion() {
 correccionItemsBody.querySelectorAll("input[data-campo]").forEach((input) => {
 const handler = () => {
 const filaId = Number(input.getAttribute("data-fila-id"));
 const campo = input.getAttribute("data-campo");
 const item = estadoCorreccion.items.find(it => it.filaId === filaId);
 if (!item) return;
 item[campo] = Number(input.value);
 renderItemsCorreccion();
 actualizarTotalCorreccion();
 };
 input.addEventListener("change", handler);

 function abrirCorreccion(tipo, registro) {
 estadoCorreccion.tipo = tipo;

 if (tipo === "compra") {
 correccionThead.innerHTML = THEAD_CORRECCION_COMPRA;
 estadoCorreccion.items = (registro.items || []).map((item) => {

 // traen esos campos: se asumen como "1 paquete con todas las unidades"
 // para que el total coincida exactamente con lo ya guardado.
 const cantidadPaquete = numeroSeguro(item.cantidadPaquete) > 0 ? Math.trunc(numeroSeguro(item.cantidadPaquete)) : 1;
 const unidadesPorPaquete = numeroSeguro(item.unidadesPorPaquete) > 0 ? Math.trunc(numeroSeguro(item.unidadesPorPaquete)) : cantidad;
 const precioPaquete = numeroSeguro(item.precioPaquete) > 0 ? numeroSeguro(item.precioPaquete) : numeroSeguro(item.subtotal);
 return {
 filaId: idCorreccionSeq++,
 productoId: item.productoId,
 nombre: item.nombre || "Producto",
 cantidadPaquete,
 unidadesPorPaquete,
 precioPaquete,
 };
 });
 } else {
 correccionThead.innerHTML = THEAD_CORRECCION_VENTA;
 estadoCorreccion.items = (registro.items || []).map((item) => ({

 correccionErrMotivo.classList.remove("show");

 if (estadoCorreccion.items.length === 0) {

 const esCompra = estadoCorreccion.tipo === "compra";

 : estadoCorreccion.items.some((it) => !(numeroSeguro(it.cantidad) > 0) || numeroSeguro(it.precioUnitario) < 0 || numeroSeguro(it.costoUnitario) < 0);

 if (esCompra && !correccionProveedor.value.trim()) {

 const usuario = getUsuarioActual();
 const itemsPayload = esCompra
 ? estadoCorreccion.items.map((it) => ({

 : estadoCorreccion.items.map((it) => ({

 correccionBtnGuardar.disabled = true;

 try {

 card.innerHTML = `

 <div class="bita-meta">

 <div class="bita-usuario"> ${c.proveedor || "Sin proveedor"} &mdash; ${c.usuarioNombre || "—"}</div>
 </div>
 <span class="bita-total">${formatearMoneda(c.total ?? 0)}</span>
 <span class="bita-metodo">${metodoTexto}</span>
 ${puedeCorregir ? `<button type="button" class="btn-corregir" data-corregir-compra-id="${c.id}">✏️ Corregir</button>` : ""}
 <span class="bita-chevron">▼</span>

 <div class="bita-body">

 <th>Producto</th>
 <th class="num">Cant.</th>

 </thead>
 <tbody>${itemsHTML}</tbody>
 </table>

 ${facturaHTML}
 </div>`;

 card.querySelector(".bita-header").addEventListener("click", () => toggleCard(card));
 const btnCorregirCompra = card.querySelector("[data-corregir-compra-id]");
 if (btnCorregirCompra) {

 abrirCorreccion("compra", c);
 });
 }

 });

 filtroFechaCompra.addEventListener("change", renderCompras);
 btnLimpiarFiltrosCompra.addEventListener("click", () => {
 filtroFechaCompra.value = "";
 renderCompras();
 });

 unsubs.compras = onSnapshot(
 query(collection(db, "compras"), orderBy("creadoEn", "desc"), limit(300)),
 (snap) => {
 comprasCache = snap.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
 renderCompras();
 },
 (err) => {
 console.error("Bitácora compras:", err);
 contenedorCompras.innerHTML = `
 <div class="alerta alerta-error show">

 // ════════════════════════════════════════════════════════════════════════
 // TAB FONDOS
 // ════════════════════════════════════════════════════════════════════════
 const contenedorFondos = document.getElementById("tab-fondos");

 async function cargarResumenFondos() {
 const el = document.getElementById("fondos-resumen-datos");
 if (!el) return;
 try {
 const [snapFondos, snapProductos, snapVentas] = await Promise.all([
 getDocs(collection(db, "fondos_entrada")),
 getDocs(collection(db, "productos")),
 getDocs(collection(db, "ventas"))
 ]);

 let totalCompras = 0, totalVentas = 0;
 snapFondos.forEach(d => {
 const f = d.data();
 if (f.origen === "compra") totalCompras += numeroSeguro(f.monto);
 if (f.origen === "venta") totalVentas += numeroSeguro(f.monto);
 });

 // utilidadTotal ya incluye merma sin vender como negativo — no restar perdidaTotal
 let gananciaRealizada = 0;
 snapVentas.forEach(d => {
 gananciaRealizada += numeroSeguro(d.data().utilidadTotal);
 });

 let gananciaStock = 0;
 snapProductos.forEach(d => {
 const p = d.data();
 if (p.activo === false) return;
 const stock = numeroSeguro(p.stock);
 const costo = numeroSeguro(p.precioCompra ?? p.ultimoCosto ?? 0);
 const precio = numeroSeguro(p.precioVenta ?? 0);
 if (stock > 0) gananciaStock += (precio - costo) * stock;
 });

 const fmtSig = (v) => `${v >= 0 ? "+" : "−"}${formatearMoneda(Math.abs(v))}`;

 el.innerHTML = `
 <div class="fondos-stat">
 <div class="fondos-stat-label">Total de compras</div>
 <div class="fondos-stat-valor egreso">−${formatearMoneda(totalCompras)}</div>
 </div>
 <div class="fondos-stat">
 <div class="fondos-stat-label">Total de ventas</div>
 <div class="fondos-stat-valor ingreso">+${formatearMoneda(totalVentas)}</div>
 </div>
 <div class="fondos-stat">
 <div class="fondos-stat-label">Ganancia de ventas realizada</div>
 <div class="fondos-stat-valor ${gananciaRealizada >= 0 ? "ingreso" : "egreso"}">
 ${fmtSig(gananciaRealizada)}
 </div>
 </div>
 <div class="fondos-stat">
 <div class="fondos-stat-label">Ganancia en stock por vender</div>
 <div class="fondos-stat-valor ${gananciaStock >= 0 ? "ingreso" : "egreso"}">
 ${fmtSig(gananciaStock)}
 </div>
 </div>`;
 } catch (e) {
 console.error("Resumen fondos:", e);
 }
 }

 unsubs.fondos = onSnapshot(
 query(collection(db, "fondos_entrada"), orderBy("creadoEn", "desc"), limit(50)),
 (snap) => {
 contenedorFondos.innerHTML = `
 <div class="fondos-resumen" id="fondos-resumen-datos">
 <div class="fondos-stat"><div class="fondos-stat-label">Cargando...</div></div>
 </div>
 <div class="fondos-seccion-titulo">HISTORIAL DE OPERACIONES</div>`;

 cargarResumenFondos();

 if (snap.empty) {
 contenedorFondos.insertAdjacentHTML("beforeend", `
 <div class="empty-state">
 <div class="emoji"></div>
 <p>No hay movimientos de fondos aún.</p>
 </div>`);
 return;
 }

 snap.forEach((docSnap, idx) => {
 const f = docSnap.data();
 const esIngreso = f.tipo === "ingreso";
 const item = document.createElement("div");
 item.className = "mov-item";
 item.style.animationDelay = `${idx * 0.04}s`;

 const origenTexto = {
 venta: "Venta",
 compra: "Compra",
 manual: "Manual"
 }[f.origen] || f.origen || "—";

 item.innerHTML = `
 <div class="mov-icono ${esIngreso ? "entrada" : "salida"}">
 ${esIngreso ? "▲" : "▼"}
 </div>
 <div class="mov-info">
 <div class="mov-titulo">${f.titulo || "—"}</div>
 <div class="mov-detalle">
 ${origenTexto} · ${f.usuarioNombre || "—"} · ${formatearFecha(f.creadoEn)}
 </div>
 ${f.descripcion ? `<div class="mov-detalle" style="margin-top:2px;"> ${f.descripcion}</div>` : ""}
 </div>
 <div class="mov-monto ${esIngreso ? "ingreso" : "egreso"}">
 ${esIngreso ? "+" : "−"}${formatearMoneda(f.monto ?? 0)}
 </div>`;

 contenedorFondos.appendChild(item);
 });
 },
 (err) => {
 console.error("Bitácora fondos:", err);
 contenedorFondos.innerHTML = `
 <div class="alerta alerta-error show">
 ️ Error al cargar fondos. ${err.message}
 </div>`;
 }
 );

 contenedorMermas.innerHTML = "";
 snap.forEach((docSnap, idx) => {

 </tr>`).join("");

 const perdidaTotal = numeroSeguro(m.totalPerdida);
 const utilidadTotal = numeroSeguro(m.utilidadTotal);

 card.innerHTML = `
 <div class="bita-header">
 <div class="bita-meta">
 <div class="bita-fecha">${formatearFecha(m.creadoEn)}</div>
 <div class="bita-usuario"> ${m.usuarioNombre || "—"}</div>
 </div>
 <span class="bita-metodo" style="background:var(--rojo-fondo);color:var(--rojo);">
 ️ Merma
 </span>
 <span class="bita-chevron">▼</span>
 </div>
 <div class="bita-body">
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
 <span class="stock-badge salida">Pérdida total: ${formatearMoneda(perdidaTotal)}</span>
 <span class="stock-badge entrada">Impacto neto: ${utilidadFormateada(utilidadTotal)}</span>
 </div>
 <table class="items-tabla">
 <thead><tr><th>Producto</th><th class="num">Cant.</th><th class="num">Costo</th><th class="num">Impacto</th></tr></thead>
 <tbody>${itemsHTML}</tbody>
 </table>
 ${m.motivo ? `<p style="margin-top:10px;font-size:13px;color:var(--rojo);"> Motivo: ${m.motivo}</p>` : ""}
 </div>`;

 card.querySelector(".bita-header").addEventListener("click", () => toggleCard(card));
 contenedorMermas.appendChild(card);
 });
 },
 (err) => {

 contenedorMermas.innerHTML = `
