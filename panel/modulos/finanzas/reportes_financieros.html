<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTECS — Reporte financiero</title>
  <link rel="stylesheet" href="../../../css/styles.css" />
  <style>
    /* Full-width report layout overrides */
    body, html {height:100%;}
    .container{max-width:none;padding:20px 28px}
    .card{width:100%;box-sizing:border-box}
    .summary-grid{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}
    .summary-card{flex:1 1 180px;background:#fff;padding:18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
    .table-card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    @media(max-width:1200px){.charts{grid-template-columns:1fr}}
    @media(max-width:600px){
      .container{padding:22px 10px 40px}
      .card{padding:14px 12px !important}
      .summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 16px}
      .summary-card{min-width:0;padding:13px 10px;border-radius:14px;border-top:2px solid var(--verde-claro)}
      .charts{gap:12px}
      .table-card{max-width:100%;overflow-x:auto;border-radius:14px;padding:12px 10px}
      .table-card h3{font-size:14px;line-height:1.3}
      canvas{max-width:100%;height:auto !important;min-height:220px}
      .table-card table{min-width:520px}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Reportes financieros</h1>
    <a href="../../../panel/dashboard.html" class="btn-volver" title="Volver al panel" aria-label="Volver al panel"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
  </div>
  <div class="container">
    <div class="card" style="padding:18px;">
      <div class="summary-grid">
        <div class="summary-card">
          <div style="font-size:12px;color:var(--gris-medio)">Ventas totales</div>
          <div id="ventasTotal" style="font-size:20px;font-weight:700;margin-top:6px">$0</div>
        </div>
        <div class="summary-card">
          <div style="font-size:12px;color:var(--gris-medio)">Compras totales</div>
          <div id="comprasTotal" style="font-size:20px;font-weight:700;margin-top:6px">$0</div>
        </div>
        <div class="summary-card">
          <div style="font-size:12px;color:var(--gris-medio)">Ganancia neta</div>
          <div id="gananciaTotal" style="font-size:20px;font-weight:700;margin-top:6px">$0</div>
        </div>
        <div class="summary-card">
          <div style="font-size:12px;color:var(--gris-medio)">Pérdidas</div>
          <div id="perdidasTotal" style="font-size:20px;font-weight:700;margin-top:6px">$0</div>
        </div>
      </div>

      <div class="charts">
        <div class="table-card">
          <h3 style="margin:6px 0">Ventas vs Compras (últimos 6 meses)</h3>
          <canvas id="ventasComprasChart" height="200"></canvas>
        </div>
        <div class="table-card">
          <h3 style="margin:6px 0">Top productos (ingresos)</h3>
          <canvas id="topProductsChart" height="200"></canvas>
        </div>
      </div>

      <div style="display:flex;gap:20px;margin-top:18px;flex-wrap:wrap;">
        <div class="table-card" style="flex:1 1 420px;">
          <h3 style="margin:6px 0">Productos más vendidos</h3>
          <table style="width:100%;border-collapse:collapse">
            <thead style="text-align:left;color:var(--gris-medio);font-size:13px"><tr><th>Producto</th><th>Unidades</th><th>Ingresos</th></tr></thead>
            <tbody id="topTable"></tbody>
          </table>
        </div>

        <div class="table-card" style="flex:1 1 300px;">
          <h3 style="margin:6px 0">Productos en riesgo / recomendación</h3>
          <table style="width:100%;border-collapse:collapse">
            <thead style="text-align:left;color:var(--gris-medio);font-size:13px"><tr><th>Producto</th><th>Motivo</th><th>Acción</th></tr></thead>
            <tbody id="riskTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module">
    import { guardRoute } from "../../../js/core/auth.js";
    guardRoute();
    import initReportes from "../../../js/modulos/reportes_financieros.js";
    initReportes();
  </script>
</body>
</html>
