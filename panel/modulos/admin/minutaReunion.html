<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CONTECS — Minuta de Reunión</title>
  <link rel="stylesheet" href="../../../css/styles.css"/>
  <script type="module">
    import { guardRoute, requirePermiso } from "../../../js/core/auth.js";
    guardRoute();
    requirePermiso("gestionar_secretaria");
  </script>
  <style>
    .btn-primary { background: linear-gradient(135deg, var(--verde) 0%, var(--verde-claro) 100%); box-shadow: 0 4px 12px var(--verde-sombra); }
    .btn-primary:hover { opacity: 0.88; }
    .btn-outline { color: var(--verde-oscuro); border-color: var(--verde-oscuro); }
    .btn-outline:hover { background: var(--verde-fondo); }
    .container { max-width: 1000px; }
    .seccion-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--verde-oscuro); border-bottom: 1px solid var(--verde-claro);
      padding-bottom: 4px; margin-bottom: 12px;
    }
    .meta-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px 20px; font-size: 13px; }
    .meta-grid strong { color: var(--verde-oscuro); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }

    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .check-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--verde); cursor: pointer; flex-shrink: 0; }

    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    #minuta-md {
      width: 100%; min-height: 420px; font-family: "Consolas", "Courier New", monospace;
      font-size: 13px; line-height: 1.5; padding: 12px; border: 1.5px solid var(--gris-borde);
      border-radius: 8px; resize: vertical;
    }
    #minuta-preview {
      min-height: 420px; padding: 14px 16px; border: 1.5px solid var(--gris-borde);
      border-radius: 8px; background: #fafcfa; overflow-y: auto; font-size: 14px; line-height: 1.6;
    }
    #minuta-preview h1 { font-size: 19px; color: var(--verde-oscuro); margin: 10px 0 6px; }
    #minuta-preview h2 { font-size: 16px; color: var(--verde-oscuro); margin: 8px 0 4px; }
    #minuta-preview ul { margin: 4px 0 10px 20px; padding: 0; }
    #minuta-preview p { margin: 0 0 10px; }
    #minuta-preview .vacio { color: var(--gris-medio); font-style: italic; }

    @media(max-width:800px) {
      .editor-grid { grid-template-columns: 1fr; }
      .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1 id="minuta-titulo">Minuta — cargando…</h1>
  <a href="minutas.html" class="topbar-link">← Minutas</a>
</div>

<div class="container anim-page-in">
  <div id="alerta-global" class="alerta"></div>

  <!-- METADATOS -->
  <div class="card" style="border-left:3px solid var(--verde-claro);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="seccion-label" style="margin-bottom:0;border-bottom:none;padding-bottom:0;">Datos de la reunión</div>
      <a id="link-editar-reunion" href="#" class="btn btn-outline btn-sm" style="width:auto;text-decoration:none;">✏️ Editar reunión</a>
    </div>
    <div class="meta-grid" id="meta-grid">
      <div class="spinner" style="margin:0;"></div>
    </div>
  </div>

  <!-- ASISTENCIA -->
  <div class="card" style="border-left:3px solid var(--verde-claro);">
    <div class="seccion-label">Asistencia</div>
    <div class="checkbox-grid" id="grid-asistencia">
      <div class="spinner" style="margin:0;"></div>
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-outline btn-sm" id="btn-guardar-asistencia" type="button" style="width:auto;">Guardar asistencia</button>
    </div>
  </div>

  <!-- EDITOR DE MINUTA -->
  <div class="card" style="border-left:3px solid var(--verde-claro);">
    <div class="seccion-label">Contenido de la minuta (Markdown simple)</div>
    <p style="font-size:12px;color:var(--gris-medio);margin-bottom:10px;">
      Usa <code># Título</code>, <code>## Subtítulo</code>, <code>- viñeta</code> y <code>**negrita**</code>.
    </p>
    <div class="editor-grid">
      <textarea id="minuta-md" placeholder="Escribe aquí el contenido de la minuta..."></textarea>
      <div id="minuta-preview"></div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
      <button class="btn btn-outline" id="btn-guardar-minuta" style="flex:1;">Guardar minuta</button>
      <button class="btn btn-primary" id="btn-exportar-docx" style="flex:1;">📄 Exportar a .docx</button>
    </div>
  </div>
</div>

<script type="module" src="../../../js/modulos/minutaReunion.js"></script>
</body>
</html>
