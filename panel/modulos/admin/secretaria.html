<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>CONTECS — Secretaria</title>
 <link rel="stylesheet" href="../../../css/styles.css"/>
 <script type="module">
   import { guardRoute, requirePermiso } from "../../../js/core/auth.js";
   guardRoute();
   requirePermiso("gestionar_secretaria");
 </script>
<style>
 .btn-volver {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 width: 36px; height: 36px;
 border-radius: 50%;
 background: rgba(255,255,255,0.15);
 border: 1px solid rgba(255,255,255,0.25);
 color: var(--blanco, #fff);
 transition: background 0.2s, transform 0.15s;
 text-decoration: none;
 }
 .btn-volver:hover { background: rgba(255,255,255,0.28); }
 .btn-volver:active { transform: scale(0.92); }

 .grid-accesos {
   display: grid;
   grid-template-columns: 1fr 1fr;
   gap: 14px;
 }
 .acceso-card {
   background: #fff;
   border: none;
   border-radius: 14px;
   box-shadow: 0 2px 8px rgba(0,0,0,0.07);
   padding: 26px 16px 20px;
   text-align: center;
   cursor: pointer;
   text-decoration: none;
   display: flex;
   flex-direction: column;
   align-items: center;
   gap: 8px;
   border-bottom: 3px solid var(--verde-claro);
   transition: transform 0.2s, box-shadow 0.2s;
 }
 .acceso-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 28px rgba(0,114,46,0.18); }
 .acceso-card:active { transform: scale(0.94); }
 .acceso-card .icono { font-size: 32px; line-height: 1; }
 .acceso-card .label { font-size: 14px; font-weight: 600; color: var(--gris-texto); }
 .acceso-card.full { grid-column: 1 / -1; }
 </style>
</head>
<body>
 <div class="topbar">
 <h1>💼 Dashboard Secretaria</h1>
 <a href="../../../panel/dashboard.html" class="btn-volver" title="Volver"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
 </div>
 <div class="container anim-page-in">
   <div class="grid-accesos">
     <a href="minutas.html" class="acceso-card">
       <span class="icono">📝</span>
       <span class="label">Minutas de reunión</span>
     </a>
     <a href="agendarReunion.html" class="acceso-card">
       <span class="icono">📅</span>
       <span class="label">Agendar reunión</span>
     </a>
     <a href="../voluntariado/calendario.html" class="acceso-card full">
       <span class="icono">🗓️</span>
       <span class="label">Ver calendario</span>
     </a>
   </div>
 </div>
</body>
</html>
