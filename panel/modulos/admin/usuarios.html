<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>CONTECS — Gestión de Usuarios</title>
 <link rel="preconnect" href="https://fonts.googleapis.com"/>
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"/>
 <link rel="stylesheet" href="../../../css/styles.css?v=20260906.1"/>
 <style>
 .usuario-card {
 background: #fff;
 border-radius: 12px;
 box-shadow: 0 2px 8px rgba(0,0,0,0.07);
 padding: 16px;
 margin-bottom: 10px;
 display: flex;
 align-items: center;
 gap: 14px;
 border-left: 3px solid #e3e3e6;
 transition: border-color 0.2s;
 }
 .usuario-card.con-rol { border-left-color: #39b54a; }
 .usuario-card.sin-rol { border-left-color: #c47f17; }
 .foto {
 width: 44px; height: 44px;
 border-radius: 50%;
 background: linear-gradient(135deg, #045223, #00722e);
 display: flex; align-items: center; justify-content: center;
 font-size: 18px;
 color: #fff;
 font-weight: 700;
 flex-shrink: 0;
 overflow: hidden;
 }
 .foto img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
 .info { flex: 1; min-width: 0; }
 .info .nombre { font-size: 14px; font-weight: 600; color: #1d1d1f; }
 .info .email { font-size: 12px; color: #86868b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .rol-select {
 padding: 7px 10px;
 border: 1.5px solid #e3e3e6;
 border-radius: 8px;
 font-size: 13px;
 font-family: 'Segoe UI', system-ui, sans-serif;
 color: #1d1d1f;
 background: #fff;
 cursor: pointer;
 transition: border-color 0.15s;
 flex-shrink: 0;
 }
 .rol-select:focus { outline: none; border-color: #00722e; }
 .guardando { font-size: 12px; color: #39b54a; margin-top: 2px; display: none; }
 .filtros {
 display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
 }
 .filtro-btn {
 padding: 6px 14px;
 border-radius: 20px;
 border: 1.5px solid #e3e3e6;
 background: #fff;
 font-size: 12px;
 font-weight: 600;
 cursor: pointer;
 color: #86868b;
 transition: all 0.15s;
 }
 .filtro-btn.activo {
 background: #00722e;
 border-color: #00722e;
 color: #fff;
 }
 .contador {
 font-size: 13px;
 color: #86868b;
 margin-bottom: 12px;
 }
 .contador strong { color: #00722e; }

 .busqueda-bar {
 display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
 }
 .busqueda-bar input, .busqueda-bar select {
 padding: 8px 12px;
 border: 1.5px solid #e3e3e6;
 border-radius: 8px;
 font-size: 13px;
 font-family: inherit;
 color: #1d1d1f;
 background: #fff;
 }
 .busqueda-bar[hidden] { display: none; }
 .busqueda-bar input { flex: 1; min-width: 200px; }
 .busqueda-bar input:focus, .busqueda-bar select:focus { outline: none; border-color: #00722e; }
 .btn-eliminar-usuario {
 flex-shrink: 0;
 width: 36px; height: 36px;
 display: inline-flex; align-items: center; justify-content: center;
 border-radius: 8px;
 border: 1.5px solid var(--rojo-fondo, #fdecea);
 background: var(--rojo-fondo, #fdecea);
 color: var(--rojo, #c0392b);
 cursor: pointer;
 transition: background 0.15s, color 0.15s;
 }
 .btn-eliminar-usuario:hover { background: var(--rojo, #c0392b); color: #fff; }
 .btn-eliminar-usuario:disabled { opacity: 0.4; cursor: not-allowed; }

 .btn-volver {
 display: inline-flex;
 align-items: center;
 justify-content: center;
 width: 36px; height: 36px;
 border-radius: 50%;
 background: rgba(255,255,255,0.15);
 border: 1px solid rgba(255,255,255,0.25);
 color: var(--blanco, #fff);
 transition: background 0.2s, transform 0.15s;
 text-decoration: none;
 }
 .btn-volver:hover { background: rgba(255,255,255,0.28); }
 .btn-volver:active { transform: scale(0.92); }
 @media(max-width:600px) {
   .usuario-card {
     display:grid;
     grid-template-columns:44px minmax(0,1fr);
     gap:10px 12px;
     padding:14px;
     border-left:0;
     border-top:3px solid var(--gris-borde);
     border-radius:15px;
   }
   .usuario-card.con-rol { border-top-color:var(--verde-claro); }
   .usuario-card.sin-rol { border-top-color:var(--amarillo); }
   .rol-select { grid-column:1 / -1; width:100%; min-height:42px; font-size:16px; }
   .btn-eliminar-usuario { grid-column:1 / -1; width:100%; height:40px; gap:6px; }
   .btn-eliminar-usuario::after { content:"Eliminar usuario"; font-size:13px; font-weight:600; }
   .busqueda-bar input, .busqueda-bar select { flex:1 1 100%; min-width:0; font-size:16px; min-height:42px; }
   .guardando { grid-column:1 / -1; }
   .filtros { flex-wrap:nowrap; overflow-x:auto; padding-bottom:5px; scrollbar-width:none; }
   .filtros::-webkit-scrollbar { display:none; }
   .filtro-btn { flex:0 0 auto; min-height:36px; }
 }
 </style>
  <script type="speculationrules">
  { "prefetch": [{ "where": { "href_matches": "/*panel/*" }, "eagerness": "moderate" }] }
  </script>
</head>
<body>
 <div class="topbar">
 <h1>Gestión de Usuarios</h1>
 <a href="../../../panel/dashboard.html" class="btn-volver" title="Volver"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
 </div>

 <div class="container">
 <div class="card">
 <div class="card-title"> Miembros registrados</div>
 <p style="font-size:13px;color:#86868b;margin-bottom:16px;">
 Cada persona que inicia sesión por primera vez aparece aquí con rol <strong>Sin rol</strong>. Asígnales su comisión con el selector.
 </p>

 <div class="filtros">
 <button class="filtro-btn activo" data-filtro="todos">Todos</button>
 <button class="filtro-btn" data-filtro="sin_rol">Sin rol</button>
 <button class="filtro-btn" data-filtro="con_rol"> Con rol</button>
 </div>

 <div class="busqueda-bar" id="busqueda-bar" hidden>
 <input type="search" id="inp-buscar-usuario" placeholder="Buscar por nombre o correo..." autocomplete="off"/>
 <select id="fil-rol-usuario" aria-label="Filtrar por rol">
 <option value="">Todos los roles</option>
 </select>
 </div>

 <div class="contador" id="contador">Cargando...</div>

 <div class="spinner-wrap" id="spinner">
 <div class="spinner"></div>
 </div>

 <div id="lista-usuarios"></div>
 </div>
 </div>

 <script type="module" src="../../../js/modulos/usuarios.js"></script>
</body>
</html>
