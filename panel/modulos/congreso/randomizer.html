<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <link rel="icon" href="../../../favicon.ico" sizes="any"/>
 <link rel="apple-touch-icon" href="../../../apple-touch-icon.png"/>
 <title>CONTECS — Randomizer</title>
 <link rel="preconnect" href="https://fonts.googleapis.com"/>
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"/>
 <link rel="stylesheet" href="../../../css/styles.css?v=20260906.1"/>
 <script type="module">
 import { guardRoute, requirePermiso } from "../../../js/core/auth.js";
 guardRoute();
 await requirePermiso("acceso_posper");
 </script>
 <style>
 /* Colores del sitio de POSPER (patrocinador): azul noche, azul y rojo
    "láser"; las tarjetas de ganadores llevan su degradado. */
 :root {
   --pp-noche: #061b2a;
   --pp-azul: #0b3857;
   --pp-rojo: #980000;
   --pp-laser: #cc0000;
   --pp-borde: rgba(204, 0, 0, 0.4);
   --pp-degradado: radial-gradient(circle at 85% 40%, rgba(204,0,0,0.68), transparent 34%), linear-gradient(125deg, #061b2a 0%, #0b3857 55%, #980000 100%);
 }
 .topbar { background: var(--pp-noche) !important; }
 .pp-h1 { display: flex; align-items: center; gap: 10px; }
 .pp-logo { position: relative; display: block; flex-shrink: 0; }
 .pp-logo img { position: relative; z-index: 1; height: 1.2em; width: auto; display: block; }
 /* Láser del logo en CSS: el PNG viene sin él (en la captura salía
    irregular). Como en el logo de POSPER, va por detrás de las letras
    (::before, bajo la imagen) y por delante del código de barras (::after,
    hasta el 15.5 % del ancho). */
 .pp-logo::before, .pp-logo::after { content: ""; position: absolute; left: 2%; right: 2.2%; top: 50.6%; height: 7.4%; min-height: 1.5px; background: var(--pp-laser); }
 .pp-logo::after { right: 84.5%; z-index: 2; }
 body { background: radial-gradient(circle at 88% -5%, rgba(204,0,0,0.08), transparent 32%), linear-gradient(180deg, #eef2f6 0, var(--gris-suave) 240px); }
 .card { border-left-color: var(--pp-laser); }
 .card-title { border-bottom-color: #e7eef4; }
 th { background: #e7eef4; color: var(--pp-azul); border-bottom-color: var(--pp-azul); }
 .btn-primary:hover { box-shadow: 0 8px 24px rgba(204, 0, 0, 0.32); }
 .container { max-width: 1100px; }
 .btn-primary {
 background: linear-gradient(135deg, var(--pp-laser) 0%, var(--pp-rojo) 100%);
 box-shadow: 0 4px 12px rgba(204, 0, 0, 0.25);
 }
 .btn-outline { color: var(--pp-azul); border-color: var(--pp-azul); }
 .card-title { color: var(--pp-azul); }

 .barra { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
 .barra .form-groupE { flex: 1; min-width: 220px; margin: 0; }
 .barra .form-groupE.cantidad { flex: 0 0 120px; min-width: 0; }
 .barra .btn { width: auto; }
 .btn-vivo { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
 #btn-batir { min-width: 170px; font-size: 17px; font-weight: 800; letter-spacing: 1px; }
 .conteo { font-size: 13px; color: var(--gris-medio); margin-top: 10px; }
 .conteo strong { color: var(--pp-azul); }

 .ganadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
 .ganador { position: relative; border-radius: var(--radio-lg); padding: 20px 16px 18px; color: #fff; text-align: center; background: var(--pp-degradado); box-shadow: 0 8px 24px rgba(6, 27, 42, 0.28); min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
 .ganador.listo { animation: revelar var(--dur-vista) var(--ease-spring); }
 @keyframes revelar { from { transform: scale(0.9); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
 .ganador-pos { position: absolute; top: 10px; left: 12px; font-family: var(--fuente-display); font-size: 13px; font-weight: 700; opacity: 0.8; }
 .ganador-nombre { font-family: var(--fuente-display); font-size: 21px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
 .ganador-dato { font-size: 13px; opacity: 0.9; overflow-wrap: anywhere; }
 .ganador-rfid { display: inline-block; margin: 4px auto 0; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.18); font-family: ui-monospace, Consolas, monospace; font-size: 13px; }

 .rfid { font-family: ui-monospace, Consolas, monospace; color: var(--pp-azul); font-weight: 600; white-space: nowrap; }
 tr.es-ganador td { background: rgba(204, 0, 0, 0.07); font-weight: 600; }
 .btn-liberar { width: auto; color: var(--rojo); border-color: var(--rojo); white-space: nowrap; }
 #tabla-rfid td { font-size: 13px; }

 @media (max-width: 760px) {
   .ganadores { grid-template-columns: minmax(0, 1fr); }
   .barra .btn { width: 100%; }
   #tabla-rfid td { white-space: nowrap; }
 }
 @media (prefers-reduced-motion: reduce) {
   .ganador.listo { animation: none; }
 }
 </style>
</head>
<body>

<div class="topbar">
 <h1 class="pp-h1"><span class="pp-logo"><img src="../../../img/posper/posper-logo-blanco.png" alt="POSPER" width="448" height="81"/></span> Randomizer</h1>
 <a href="../../dashboard.html" class="btn-volver" title="Volver al inicio" aria-label="Volver al inicio"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
</div>

<div class="container anim-page-in">

 <div id="alerta" class="alerta" style="margin-bottom:12px;"></div>

 <div class="card" style="border: 2px solid var(--pp-borde);">
 <div class="card-title">Participantes con RFID anclado</div>
 <div class="barra">
 <div class="form-groupE">
 <label for="sel-evento">Evento</label>
 <select id="sel-evento"><option value="">Todos los eventos</option></select>
 </div>
 <div class="form-groupE cantidad">
 <label for="cantidad">Ganadores</label>
 <input type="number" id="cantidad" min="1" max="50" value="3" inputmode="numeric"/>
 </div>
 <button class="btn btn-outline" id="btn-ver-todos" type="button" style="display:none;">Ver todos</button>
 <button class="btn btn-primary" id="btn-batir" type="button" disabled>BATIR</button>
 <a class="btn btn-outline btn-vivo" href="randomizerint.html" title="Pantalla para proyectar el sorteo">Sorteo en vivo</a>
 </div>
 <div class="conteo" id="conteo">Cargando participantes...</div>
 </div>

 <div id="ganadores" class="ganadores" style="display:none;" aria-live="polite"></div>

 <div class="card">
 <div class="card-title" id="titulo-tabla">Todos los participantes con RFID</div>
 <div class="tabla-wrap">
 <table>
 <thead><tr>
 <th>#</th><th>Nombre</th><th>Cédula</th><th>Correo</th><th>Institución</th><th>Código</th><th>RFID</th><th>Anclado</th><th id="th-acciones" hidden></th>
 </tr></thead>
 <tbody id="tabla-rfid"><tr><td colspan="8" style="text-align:center;color:var(--gris-medio)">Cargando...</td></tr></tbody>
 </table>
 </div>
 </div>

</div>

<script type="module" src="../../../js/modulos/randomizer.js?v=20261008.2"></script>
</body>
</html>
