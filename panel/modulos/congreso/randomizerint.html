<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <link rel="icon" href="../../../favicon.ico" sizes="any"/>
 <link rel="apple-touch-icon" href="../../../apple-touch-icon.png"/>
 <title>CONTECS — Sorteo en vivo</title>
 <link rel="preconnect" href="https://fonts.googleapis.com"/>
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"/>
 <link rel="stylesheet" href="../../../css/styles.css?v=20260906.1"/>
 <script type="module">
 import { guardRoute, requirePermiso } from "../../../js/core/auth.js";
 guardRoute();
 await requirePermiso("acceso_posper");
 </script>
 <style>
 /* Pantalla para proyectar con el degradado y colores del sitio de POSPER
    (azul noche → azul → rojo, línea roja de "láser" como en su logo); el
    dorado queda para los ganadores. Todo se lee a varios metros. */
 :root {
   --ri-fondo: #061b2a;
   --ri-azul: #0b3857;
   --ri-rojo: #980000;
   --ri-laser: #cc0000;
   --ri-laser-claro: #ff3b3b;
   --ri-dorado: #ffd34d;
   --ri-texto: #f4f8ff;
   --ri-suave: rgba(244, 248, 255, 0.68);
 }
 html, body { min-height: 100%; }
 body {
   margin: 0; color: var(--ri-texto); background: var(--ri-fondo);
   background-image:
     radial-gradient(circle at 85% 40%, rgba(204,0,0,0.68), transparent 34%),
     linear-gradient(125deg, #061b2a 0%, #0b3857 55%, #980000 100%);
   background-attachment: fixed;
   font-family: var(--fuente); overflow-x: hidden;
 }
 .ri { min-height: 100vh; display: flex; flex-direction: column; padding: 16px clamp(16px, 3vw, 40px) 24px; gap: 18px; box-sizing: border-box; }

 .ri-barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
 .ri-marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
 .ri-marca a { color: var(--ri-suave); display: inline-flex; width: 38px; height: 38px; border-radius: 50%; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
 .ri-marca-txt { font-family: var(--fuente-display); font-weight: 700; letter-spacing: 1px; font-size: clamp(14px, 2vw, 18px); }
 .ri-marca-txt span { color: var(--ri-laser-claro); }
 .ri-controles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
 .ri-controles select, .ri-controles input { background: rgba(255,255,255,0.08); color: var(--ri-texto); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-family: var(--fuente); }
 .ri-controles select option { color: #111; }
 .ri-controles input { width: 64px; }
 .ri-controles label { font-size: 12px; color: var(--ri-suave); }
 .ri-icono { background: rgba(255,255,255,0.08); color: var(--ri-texto); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
 .ri-icono:hover { background: rgba(255,255,255,0.16); }

 .ri-escenario { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(14px, 3vh, 28px); position: relative; }
 .ri-kicker { font-size: clamp(13px, 1.6vw, 18px); letter-spacing: 6px; text-transform: uppercase; color: var(--ri-suave); font-weight: 700; }
 .ri-titulo { font-family: var(--fuente-display); font-size: clamp(30px, 6vw, 72px); font-weight: 700; line-height: 1.05; margin: 0; }
 .ri-titulo span { color: var(--ri-laser-claro); text-shadow: 0 0 28px rgba(255,59,59,0.45); }
 /* Logo grande con su láser extendido de lado a lado de la pantalla (54 % =
    altura de la línea roja dentro de posper-logo-blanco.png). */
 .ri-logo { position: relative; width: min(560px, 80vw); }
 .ri-logo img { display: block; width: 100%; height: auto; position: relative; filter: drop-shadow(0 0 10px rgba(255,42,42,0.4)); }
 .ri-logo::before { content: ""; position: absolute; left: -100vw; right: -100vw; top: 54%; height: 3px; margin-top: -1.5px; background: var(--ri-laser-claro); box-shadow: 0 0 16px rgba(255,42,42,0.8); opacity: 0.4; }
 .ri-escenario { overflow-x: clip; }

 /* Carrete: ventana con el RFID y el nombre que pasan cada vez más lento. */
 .ri-carrete {
   width: min(920px, 100%); border-radius: 28px; padding: clamp(20px, 4vh, 40px) clamp(16px, 3vw, 40px);
   background: linear-gradient(160deg, rgba(11,56,87,0.88), rgba(6,27,42,0.92));
   border: 2px solid rgba(204,0,0,0.6);
   box-shadow: 0 0 0 6px rgba(204,0,0,0.08), 0 30px 80px rgba(0,0,0,0.55), inset 0 0 60px rgba(204,0,0,0.16);
   position: relative; overflow: hidden; box-sizing: border-box;
 }
 .ri-carrete::before, .ri-carrete::after { content: ""; position: absolute; left: 0; right: 0; height: 26%; pointer-events: none; z-index: 1; }
 .ri-carrete::before { top: 0; background: linear-gradient(rgba(6,27,42,0.95), transparent); }
 .ri-carrete::after { bottom: 0; background: linear-gradient(transparent, rgba(6,27,42,0.95)); }
 .ri-rfid { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: clamp(34px, 8vw, 104px); font-weight: 800; letter-spacing: 0.06em; line-height: 1.1; color: var(--ri-dorado); text-shadow: 0 0 24px rgba(255,211,77,0.45); overflow-wrap: anywhere; }
 .ri-nombre { margin-top: 10px; font-family: var(--fuente-display); font-size: clamp(22px, 4vw, 46px); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
 .ri-dato { margin-top: 6px; font-size: clamp(14px, 1.8vw, 20px); color: var(--ri-suave); overflow-wrap: anywhere; min-height: 1.4em; }
 .ri-carrete.girando .ri-rfid, .ri-carrete.girando .ri-nombre { filter: blur(0.6px); }
 .ri-carrete.girando .ri-rfid { animation: saltoTick 0.12s linear; }
 @keyframes saltoTick { from { transform: translateY(-14px); opacity: 0.4; } to { transform: none; opacity: 1; } }
 .ri-carrete.ganador { border-color: var(--ri-dorado); animation: pulsoGanador 1.4s ease-in-out infinite; }
 .ri-carrete.ganador .ri-nombre { animation: aparecer 0.7s var(--ease-spring) both; }
 @keyframes pulsoGanador { 0%,100% { box-shadow: 0 0 0 6px rgba(255,211,77,0.15), 0 30px 80px rgba(0,0,0,0.55), 0 0 60px rgba(255,211,77,0.35); } 50% { box-shadow: 0 0 0 14px rgba(255,211,77,0.06), 0 30px 80px rgba(0,0,0,0.55), 0 0 110px rgba(255,211,77,0.55); } }
 @keyframes aparecer { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
 .ri-insignia { display: none; margin: 0 auto 12px; padding: 6px 18px; border-radius: 999px; background: var(--ri-dorado); color: #3a2a00; font-weight: 800; letter-spacing: 3px; font-size: clamp(12px, 1.4vw, 16px); width: max-content; }
 .ri-carrete.ganador .ri-insignia { display: block; animation: aparecer 0.5s var(--ease-spring) both; }

 .ri-batir {
   font-family: var(--fuente-display); font-size: clamp(22px, 3.4vw, 38px); font-weight: 700; letter-spacing: 4px;
   padding: clamp(14px, 2.4vh, 22px) clamp(40px, 7vw, 90px); border-radius: 999px; border: none; cursor: pointer; color: #fff;
   background: linear-gradient(135deg, var(--ri-laser), var(--ri-rojo));
   box-shadow: 0 12px 40px rgba(204,0,0,0.45), inset 0 -4px 0 rgba(0,0,0,0.18);
   transition: transform 0.15s ease, filter 0.2s ease;
 }
 .ri-batir:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); filter: brightness(1.08); }
 .ri-batir:active:not(:disabled) { transform: scale(0.97); }
 .ri-batir:disabled { opacity: 0.45; cursor: not-allowed; }
 .ri-batir.listo { animation: llamar 2s ease-in-out infinite; }
 @keyframes llamar { 0%,100% { box-shadow: 0 12px 40px rgba(204,0,0,0.45); } 50% { box-shadow: 0 12px 70px rgba(255,59,59,0.75); } }
 .ri-estado { font-size: clamp(13px, 1.5vw, 17px); color: var(--ri-suave); min-height: 1.5em; }
 .ri-estado strong { color: var(--ri-texto); }

 .ri-ganadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
 .ri-ganadores:empty { display: none; }
 .ri-g { border-radius: 18px; padding: 14px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,211,77,0.45); text-align: left; animation: aparecer 0.6s var(--ease-spring) both; min-width: 0; }
 .ri-g-pos { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--ri-dorado); }
 .ri-g-nombre { font-family: var(--fuente-display); font-size: 19px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
 .ri-g-dato { font-size: 13px; color: var(--ri-suave); overflow-wrap: anywhere; }
 .ri-g-rfid { font-family: ui-monospace, Consolas, monospace; font-size: 14px; color: var(--ri-dorado); margin-top: 4px; }

 #confeti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
 .ri .alerta { margin: 0; }

 @media (max-width: 640px) {
   .ri-controles { width: 100%; }
   .ri-controles select { flex: 1; min-width: 0; }
   .ri-kicker { letter-spacing: 3px; }
 }
 @media (prefers-reduced-motion: reduce) {
   .ri-carrete.ganador, .ri-batir.listo, .ri-carrete.girando .ri-rfid { animation: none; }
 }
 </style>
</head>
<body>

<canvas id="confeti" aria-hidden="true"></canvas>

<div class="ri">
 <div class="ri-barra">
 <div class="ri-marca">
 <a href="../../dashboard.html" title="Volver al inicio" aria-label="Volver al inicio"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
 <div class="ri-marca-txt"><span>POSPER</span> × CONTECS 2026</div>
 </div>
 <div class="ri-controles">
 <select id="sel-evento" aria-label="Evento"><option value="">Todos los eventos</option></select>
 <label for="cantidad">Ganadores</label>
 <input type="number" id="cantidad" min="1" max="50" value="3" inputmode="numeric"/>
 <button class="ri-icono" id="btn-sonido" type="button" aria-pressed="true">Sonido: sí</button>
 <button class="ri-icono" id="btn-reiniciar" type="button">Reiniciar sorteo</button>
 <button class="ri-icono" id="btn-pantalla" type="button">Pantalla completa</button>
 </div>
 </div>

 <div id="alerta" class="alerta"></div>

 <div class="ri-escenario">
 <div class="ri-logo"><img src="../../../img/posper/posper-logo-blanco.png" alt="" width="448" height="81"/></div>
 <div class="ri-kicker">Gran sorteo</div>
 <h1 class="ri-titulo">¡Gracias, <span>POSPER</span>!</h1>
 <div class="ri-carrete" id="carrete" aria-live="polite">
 <div class="ri-insignia" id="insignia">GANADOR</div>
 <div class="ri-rfid" id="ri-rfid">• • • •</div>
 <div class="ri-nombre" id="ri-nombre">¿Quién se lleva el premio?</div>
 <div class="ri-dato" id="ri-dato"></div>
 </div>
 <button class="ri-batir" id="btn-batir" type="button" disabled>BATIR</button>
 <div class="ri-estado" id="ri-estado">Cargando participantes...</div>
 </div>

 <div class="ri-ganadores" id="ri-ganadores" aria-label="Ganadores"></div>
</div>

<script type="module" src="../../../js/modulos/randomizerint.js?v=20261009.1"></script>
</body>
</html>
