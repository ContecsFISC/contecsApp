name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/559368296197/locations/global/workloadIdentityPools/github-actions-pool/providers/-github-actions-provider
          service_account: github-actions-deploy@contecs-fa6e6.iam.gserviceaccount.com

      - name: Deploy to Firebase Functions
        run: npx firebase-tools@latest deploy --only functions --project contecs-fa6e6 --non-interactive
